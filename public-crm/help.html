ty, even though a direct page link from the host may still work."],"troubleshooting":[{"problem":"Why does the host's hub say 'This booking hub is being set up'?","causes":["The host hasn't published their hub yet","The handle was mistyped","The slug never synced from the host's CRM"],"fix":"Re-check the handle spelling. If it's correct, ask the host to confirm their hub is published, or request a direct link to a specific page (which may still work)."},{"problem":"The hub loads but shows no cards. Where are the meetings?","causes":["All pages are hidden from the hub","All pages are unpublished","All pages are private"],"fix":"Ask the host for a direct booking link to a specific page; a direct link can still work even when nothing is shown on the hub."},{"problem":"I see 'Something went wrong' on the hub.","causes":["A transient Firestore or network error"],"fix":"Refresh the page. If it keeps failing, try again later or contact the host."}],"faqs":[{"q":"Why does the host's hub say 'being set up'?","a":"The host hasn't published their hub yet, the handle was mistyped, or the slug isn't in use. A direct link to a specific page may still work."},{"q":"The host's brand color barely shows. Is that a bug?","a":"No. By design the page chrome is always sky blue. The host's color is a small secondary accent on the card top-border and avatar ring."},{"q":"Do I need an account to book?","a":"No. The hub and booking pages are fully public. You only enter your name and email when you confirm a booking."},{"q":"The hub is empty but I know they take meetings.","a":"Their pages may be hidden from the hub or unpublished. Ask the host for a direct booking link."},{"q":"Can I get back to the hub after opening a page?","a":"Yes. The booking page has a 'Back to hub' link in the header."},{"q":"The hub says it isn't public. What does that mean?","a":"If you see '{name}'s hub isn't public,' the host set the hub private. Use a direct booking link or contact them."}],"related":["book-a-meeting-public","find-your-booking-link"]},{"id":"book-a-meeting-public","product":"myappointment","category":"Appointments & Booking","title":"Book a meeting: pick a time, enter your details, and confirm","summary":"Walk through the booking wizard to choose a date and time, fill in your contact info, and confirm your meeting with a host.","audience":"Borrower / Client / Prospect (booker)","keywords":["book a meeting","schedule","pick a time","confirm booking","calendar invite","timezone","no availability that day","host is out of office","this booking page is not available","could not book the slot may have been taken","email looks malformed","name and email are required","no meeting type configured"],"overview":{"what":"The booking page is the scheduling wizard: you pick a date and time slot for a specific meeting type, fill in your contact info, and confirm. The confirmation triggers a calendar invite.","why":"It's the core way clients lock in time with a host. No phone tag, no back-and-forth email.","who":"Anyone booking time with a host. No account or sign-in needed."},"steps":[{"title":"Open the booking page","body":"Go to myappointment.ai/{handle}/{page}, or click a conversation card from the host's hub. The page loads the meeting type and its duration.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-1.png","caption":"The booking page loading the meeting type."},{"title":"Pick a date","body":"Use the date strip to choose one of the next 7 days (today plus six). The available time slots refresh for the date you select.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-2.png","caption":"The 7-day date strip with selectable days."},{"title":"Pick a time slot","body":"Choose an open time from the slot grid. Times are shown in your own local timezone; the host's timezone appears as a small label near their name.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-3.png","caption":"The slot grid with available times."},{"title":"Continue to your details","body":"Click 'Continue' (it's disabled until you select a slot). You'll move to the contact form. If you change your mind, use 'Pick a different slot' to go back.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-4.png","caption":"The 'Continue' button enabled after selecting a slot."},{"title":"Enter your name and email","body":"Fill in 'Your name' and 'Email' (both required). Phone is optional. Use the optional 'Anything the host should know?' box to add a note.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-5.png","caption":"The booker form with name, email, phone, and notes."},{"title":"Confirm your booking","body":"Click 'Confirm booking.' The button reads 'Booking…' while it submits. On success you'll see a green 'Confirmed' pill and 'You're booked.' with your date and time.","screenshot":"/help-screenshots/myappointment/book-a-meeting-public/step-6.png","caption":"The confirmation screen showing the booked date and time."}],"expectedResult":"You see 'You're booked.' with your formatted date and time, and a calendar invite is emailed to you shortly after.","expectedScreenshot":"/help-screenshots/myappointment/book-a-meeting-public/result.png","commonMistakes":["Looking for a date more than a week out; the picker only shows the next 7 days with no month or calendar view.","Assuming the times shown are in the host's timezone; they render in your own local timezone (the host's timezone is a small label near their name).","Expecting an immediate invite; the calendar invite is emailed after confirmation, so check your spam folder if it's slow."],"troubleshooting":[{"problem":"It says 'This booking page is not available.' Why?","causes":["The page is unpublished","The URL is wrong","The page slug doesn't match any page"],"fix":"Use the hub link shown on the page to find the host's available pages, or ask the host for the correct link."},{"problem":"No times ever appear, or it always says 'No availability that day.'","causes":["The host has no business hours set","The host is fully booked","Buffers or minimum notice push every slot past the 7-day window"],"fix":"Try other dates in the strip. If nothing works, ask the host to check their availability settings or open more time."},{"problem":"I got 'Could not book. The slot may have been taken.'","causes":["Another booker grabbed the slot first","The quoted time didn't match the meeting's real length"],"fix":"Pick another open slot. If it keeps happening, refresh the page first, or contact the host."},{"problem":"It says the page 'has no meeting type configured.'","causes":["The page has no meeting type attached"],"fix":"Reach out to the host; they need to add a meeting type to the page before it can take bookings."},{"problem":"I saw the confirmation but no invite arrived.","causes":["The invite email is still in transit","It landed in spam"],"fix":"Check your spam folder. The invite is emailed after confirmation, not shown instantly. If it never arrives, contact the host."}],"faqs":[{"q":"Do I need to create an account to book?","a":"No. You enter your name and email at the confirm step, and that's it."},{"q":"What timezone are these times in?","a":"Your own local timezone. The host's timezone is shown as a small label near their name."},{"q":"I can't find a date that works. Can I look further out?","a":"The picker shows the next 7 days only. If nothing fits, ask the host for more availability or a different page."},{"q":"I got 'the slot may have been taken.' What happened?","a":"Someone booked it first, or the time didn't match the meeting length. Pick another open slot."},{"q":"It says the host is out of office. Now what?","a":"Check back after their return date (shown when set), or follow any auto-reply instructions in the message."},{"q":"Will I get a calendar invite?","a":"Yes. After you see 'You're booked,' an invite is emailed to you, and the host follows up with next-step details."},{"q":"Can I add a note for the host?","a":"Yes. Use the optional 'Anything the host should know?' box; it's sent with your booking."}],"related":["host-booking-hub-public","find-your-booking-link"]},{"id":"manage-booking-pages-dashboard","product":"myappointment","category":"Appointments & Booking","title":"Manage your booking pages, meeting types, and upcoming bookings","summary":"Sign in to the dashboard to create booking pages, add meeting types, share your link, and review upcoming bookings.","audience":"Host / Team member (Loan officer, Realtor, or any professional)","keywords":["dashboard","booking pages","meeting types","new page","copy link","upcoming bookings","continue with google","url slug","duration","meeting location","active toggle","saved","page deleted","link copied","no booking pages yet","no upcoming meetings"],"overview":{"what":"The dashboard is where a host manages booking pages and meeting types and reviews upcoming bookings. It writes pages and meeting types directly to your account; bookings are read-only here.","why":"It's the host's control panel for setting up what clients can book and seeing who's coming up.","who":"Hosts and team members, primarily SWH CRM users who manage pages here directly. MyLola CRM users should manage pages in mylola.ai, which syncs in."},"steps":[{"title":"Sign in to the dashboard","body":"If you arrived from a CRM 'Manage' link, you're signed in automatically via a one-time token. If you arrived directly, click 'Continue with Google.'","screenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/step-1.png","caption":"The Google sign-in card with the 'Using SWH/MyLola CRM?' hint."},{"title":"Create a new booking page","body":"Click '+ New Page.' Enter a Page title (required) and a URL slug (required; it auto-slugifies to lowercase letters, numbers, and hyphens). Add an optional description and set the Status toggle, then click 'Create Page.' You'll see a 'Saved.' toast.","screenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/step-2.png","caption":"The new-page form with title, slug preview, description, and Status toggle."},{"title":"Add a meeting type","body":"Re-open the page with 'Edit,' then click '+ Add type.' In the modal, set Name (required), Duration (15/20/30/45/60/90 minutes), Meeting location (Phone call / Video call / In person / Custom) plus its value, an optional Description, and the Active toggle. Click 'Add Meeting Type.' Meeting types can only be added to pages that already exist.","screenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/step-3.png","caption":"The meeting type modal with name, duration, and location fields."},{"title":"Share your page","body":"On the Booking Pages tab, click 'Copy link' to copy the page's full URL (you'll see a 'Link copied.' toast), or click 'View' to open the live page in a new tab.","screenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/step-4.png","caption":"The per-page actions: Copy link, View, and Edit."},{"title":"Review upcoming bookings","body":"Click the 'Upcoming Bookings' tab to see up to 25 confirmed future bookings, soonest first, each with the booker's name, page title, a Today/Tomorrow/date label, time, and email.","screenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/step-5.png","caption":"The Upcoming Bookings tab with the next confirmed meetings."}],"expectedResult":"Your booking page is live with at least one active meeting type, your link copies correctly, and confirmed future bookings appear on the Upcoming Bookings tab.","expectedScreenshot":"/help-screenshots/myappointment/manage-booking-pages-dashboard/result.png","commonMistakes":["Trying to add a meeting type while still creating a brand-new page; meeting types only appear after the page is saved.","Marking a page Active but leaving zero active meeting types, so bookers hit 'No availability' or 'no meeting type configured.'","Editing a page here when you use MyLola CRM; the next CRM sync can overwrite your changes (manage in mylola.ai instead).","Creating two pages whose titles slugify to the same value; there's no uniqueness check, so the second page can become unreachable."],"troubleshooting":[{"problem":"I'm stuck on Google sign-in after clicking the CRM 'Manage' link.","causes":["The one-time custom token expired","Sign-in with the token failed"],"fix":"Re-open the 'Manage' link from your CRM to mint a fresh token, then sign in again."},{"problem":"My pages and bookings don't load after sign-in.","causes":["A load error was swallowed and shows as an empty dashboard","Permissions issue reading your own data"],"fix":"Open the browser console to check for warnings, then refresh. You can only read your own account's pages and bookings."},{"problem":"I clicked 'Copy link' and nothing happened.","causes":["The clipboard API is blocked in an insecure context or by browser permissions"],"fix":"Use 'View' to open the live page in a new tab, then copy the URL from the address bar."},{"problem":"My Upcoming tab is empty even though I have bookings.","causes":["Only confirmed, future bookings are shown","More than 25 bookings (only the next 25 appear)"],"fix":"Cancelled and past bookings are excluded by design. The tab caps at the next 25 confirmed future bookings, soonest first."}],"faqs":[{"q":"How do I get my booking link?","a":"On the Booking Pages tab, click 'Copy link' on the page, or open the hub chip in the top bar for your full hub."},{"q":"Why can't I add a meeting type to a new page?","a":"Save the page first. Meeting types appear in the page's Edit view once the page exists."},{"q":"What's the difference between a page being Active and a meeting type being Active?","a":"The page toggle controls whether clients can see the page at all. Each meeting type's Active toggle controls whether that specific option is bookable."},{"q":"I use MyLola CRM. Should I edit pages here?","a":"Manage them in mylola.ai. Those changes sync into MyAppointment. Editing here can be overwritten by the next sync."},{"q":"How many upcoming bookings does the dashboard show?","a":"Up to 25 confirmed, future bookings, soonest first."},{"q":"How do I sign in if I don't have a CRM?","a":"Use 'Continue with Google' on the dashboard."},{"q":"Where do I set buffers, reminders, or business hours?","a":"Those aren't editable in this dashboard yet. They live in your CRM or the underlying data model."},{"q":"Can I cancel or reschedule a booking from the dashboard?","a":"No. The dashboard is read-only for bookings; there's no cancel or reschedule control in this UI."}],"related":["host-booking-hub-public","book-a-meeting-public"]}];
const esc = (s) => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const view = document.getElementById('view');
const qEl = document.getElementById('q');
document.getElementById('count').textContent = ARTICLES.length + ' guides.';

function hay(a){
  return [a.title,a.summary,a.category,(a.keywords||[]).join(' '),
    (a.overview?[a.overview.what,a.overview.why,a.overview.who].join(' '):''),
    (a.troubleshooting||[]).map(t=>t.problem).join(' '),
    (a.faqs||[]).map(f=>f.q).join(' '),
    (a.steps||[]).map(s=>s.title).join(' ')].join(' \n ').toLowerCase();
}
function search(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const terms=q.split(/\s+/).filter(Boolean);
  return ARTICLES.map(a=>{
    const h=hay(a), t=a.title.toLowerCase(); let sc=0;
    if(t.includes(q))sc+=100; if(h.includes(q))sc+=20;
    for(const tm of terms){ if(t.includes(tm))sc+=12; if((a.keywords||[]).some(k=>k.toLowerCase().includes(tm)))sc+=8; if(h.includes(tm))sc+=2; }
    return {a,sc};
  }).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc).map(x=>x.a);
}
function rowHTML(a,showCat){
  return '<button class="row" data-id="'+esc(a.id)+'"><span><span class="t">'+esc(a.title)+'</span>'+
    '<span class="s">'+esc(a.summary||'')+'</span>'+
    (showCat?'<span class="meta">'+esc(a.category||'')+'</span>':'')+
    '</span><span class="arr">&rarr;</span></button>';
}
function renderHome(){
  const cats={}; for(const a of ARTICLES){ (cats[a.category]=cats[a.category]||[]).push(a); }
  const order=Object.keys(cats).sort();
  let h='<div class="sectlabel">Browse by topic</div><div class="cats">';
  for(const c of order){ h+='<button class="cat" data-cat="'+esc(c)+'"><span class="n"><span class="t">'+esc(c)+'</span><span class="c">'+cats[c].length+'</span></span></button>'; }
  h+='</div>';
  h+='<div class="sectlabel">All guides</div>';
  for(const c of order){ h+='<div class="sectlabel" style="color:var(--gold);margin-top:14px;">'+esc(c)+'</div>'; for(const a of cats[c]) h+=rowHTML(a,false); }
  view.innerHTML=h;
}
function renderResults(q){
  const r=search(q);
  if(!r.length){ view.innerHTML='<div class="empty">No results for &ldquo;'+esc(q)+'&rdquo;. Try a shorter term, or email support below.</div>'; return; }
  view.innerHTML='<div class="sectlabel">'+r.length+' result'+(r.length===1?'':'s')+'</div>'+r.map(a=>rowHTML(a,true)).join('');
}
function renderCat(cat){
  const r=ARTICLES.filter(a=>a.category===cat);
  view.innerHTML='<button class="back" id="catBack" style="margin-bottom:10px;">&larr; All topics</button><div class="sectlabel" style="color:var(--gold);">'+esc(cat)+'</div>'+r.map(a=>rowHTML(a,false)).join('');
  document.getElementById('catBack').onclick=()=>{ qEl.value=''; renderHome(); };
}
function renderArticle(id){
  const a=ARTICLES.find(x=>x.id===id); if(!a){ renderHome(); return; }
  let h='<button class="back" id="aBack" style="margin-bottom:6px;">&larr; All help</button>';
  h+='<div class="badges"><span class="badge">SWH</span><span class="badge sub">'+esc(a.category)+'</span>'+(a.audience?'<span class="badge sub">For: '+esc(a.audience)+'</span>':'')+'</div>';
  h+='<h2 class="disp">'+esc(a.title)+'</h2><p class="a-summary">'+esc(a.summary||'')+'</p>';
  if(a.overview){ h+='<div class="sec"><h3>Overview</h3>'+
    '<div class="def"><span class="k">What it does</span><span class="v">'+esc(a.overview.what)+'</span></div>'+
    '<div class="def"><span class="k">Why use it</span><span class="v">'+esc(a.overview.why)+'</span></div>'+
    '<div class="def"><span class="k">Who it\'s for</span><span class="v">'+esc(a.overview.who)+'</span></div></div>'; }
  if((a.steps||[]).length){ h+='<div class="sec"><h3>Step-by-step</h3><ol class="steps">';
    a.steps.forEach((s,i)=>{ h+='<li class="step"><span class="num">'+(i+1)+'</span><span><span class="st">'+esc(s.title)+'</span><span class="sb">'+esc(s.body)+'</span></span></li>'; });
    h+='</ol></div>'; }
  if(a.expectedResult){ h+='<div class="sec"><h3>Expected result</h3><p class="sb" style="margin:0;color:var(--text-muted);font-size:13.5px;line-height:1.6;">'+esc(a.expectedResult)+'</p></div>'; }
  if((a.commonMistakes||[]).length){ h+='<div class="sec"><h3>Common mistakes</h3><ul class="bul">'+a.commonMistakes.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul></div>'; }
  if((a.troubleshooting||[]).length){ h+='<div class="sec"><h3>Troubleshooting</h3>'+a.troubleshooting.map(t=>'<div class="tcard"><div class="tp">'+esc(t.problem)+'</div>'+((t.causes||[]).length?'<div class="tl">Possible causes</div><ul class="bul" style="margin-top:4px;">'+t.causes.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':'')+'<div class="fx"><b>Fix: </b>'+esc(t.fix)+'</div></div>').join('')+'</div>'; }
  if((a.faqs||[]).length){ h+='<div class="sec"><h3>FAQ</h3>'+a.faqs.map(f=>'<details class="faq"><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>').join('')+'</div>'; }
  view.innerHTML=h;
  document.getElementById('aBack').onclick=()=>{ history.pushState({},'',location.pathname); qEl.value=''; renderHome(); };
  window.scrollTo(0,0);
}
function route(){
  const id=new URLSearchParams(location.search).get('a');
  if(id) renderArticle(id); else if(qEl.value.trim()) renderResults(qEl.value); else renderHome();
}
view.addEventListener('click',(e)=>{
  const row=e.target.closest('.row'); if(row){ const id=row.getAttribute('data-id'); history.pushState({},'','?a='+encodeURIComponent(id)); renderArticle(id); return; }
  const cat=e.target.closest('.cat'); if(cat){ renderCat(cat.getAttribute('data-cat')); }
});
qEl.addEventListener('input',()=>{ if(qEl.value.trim()) renderResults(qEl.value); else renderHome(); });
window.addEventListener('popstate',route);
document.getElementById('backBtn').onclick=()=>{ if(history.length>1) history.back(); else location.href='./'; };
route();
</script>
</body>
</html>
