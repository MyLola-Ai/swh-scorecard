blem":"Why am I stuck on the Upgrade screen?","causes":["You have no active scorecard or pro plan"],"fix":"Subscribe to a scorecard or pro plan to unlock the app."}],"faqs":[{"q":"How do I sign in?","a":"With Google. Team members can use Microsoft for team SSO."},{"q":"Why am I on an Upgrade screen?","a":"You have no active plan. Subscribe to a scorecard or pro plan to continue."},{"q":"Why did the app freeze on my iPhone?","a":"You are likely on an old build using the web SDK on native. Update the app."},{"q":"Can I use one login for both apps?","a":"Yes. Both apps share the same Firebase project and authentication."},{"q":"How do I sign out?","a":"Go to Settings and tap Sign Out."}],"related":["crm-settings","swh-teams","scorecard-onboarding-sms-reminder"]},{"id":"scorecard-coaching-insights","product":"swh","category":"Coaching","title":"Use the Coaching tab for your weekly insights and next move","summary":"Each week SWH reads your activity and hands you a Strength, a Risk, a Recommendation, and your tier identity, so you always know the one thing to do next.","audience":"Networker (Scorecard)","keywords":["coaching","coaching tab","weekly insights","danny","danny's coaching","lead vs lag","lead points","lag points","follow through","strength risk recommendation","this week's identity","tier","handshakes are the seed","follow through is the harvest","introductions","highest leverage","what should I do next"],"overview":{"what":"The Coaching tab turns the activity you log into weekly coaching. It scores your week, shows your tier, and surfaces four insights: a Strength (what is working), a Risk (what to watch), a Recommendation (your next move), and This Week's Identity (the level you are operating at).","why":"It tells you in plain language what is working, what to watch before it costs you, and the single highest-leverage move to make next, all grounded in the SWH idea that lead activity (the handshakes and follow-throughs you control) is what builds future business.","who":"Every Scorecard user. Check it right after you log your day, and again at the start of a new week to set your focus."},"steps":[{"title":"Log your day first","body":"Open Coaching from the bottom nav. Coaching reads the activity you logged on the Home screen, so log today's networking before you check it, or the insights will be based on stale activity."},{"title":"Read this week's score and tier","body":"At the top you see your points for the week, your tier (for example Professional Networker or Master Networker), how many points per day you need to hit your goal, and how close you are to the next tier."},{"title":"Read your four insights","body":"Strength shows what you are doing well. Risk flags what to watch (often follow-through or too many lag points). Recommendation gives you one specific next move. This Week's Identity is the mindset that matches your tier."},{"title":"Do the Recommendation today","body":"The Recommendation is the single highest-leverage thing for you this week: make 2 to 3 introductions, send a few personalized follow-throughs, or push the points you still need to your goal. Act on it the same day."},{"title":"Carry last week forward","body":"Scroll down to Last Week's Coaching to see how you closed out the previous week and what to keep doing or fix this week."}],"expectedResult":"You leave the Coaching tab knowing your one next move, backed by your real activity, not a guess.","commonMistakes":["Checking Coaching before logging your day, so the insights reflect stale activity.","Reading the insights but skipping the Recommendation. The recommendation is the whole point.","Chasing points from results (lag) instead of activity (lead). Lead activity is what builds next month's pipeline."],"troubleshooting":[{"problem":"My coaching looks empty or generic.","causes":["You have not logged activity yet this week.","It is early in the week with little data."],"fix":"Log your activities on the Home screen. The insights sharpen as the week fills in."},{"problem":"It keeps telling me my follow-through is low.","causes":["You are logging conversations but not the follow-throughs after them."],"fix":"Send a few personalized follow-throughs and log them. Follow through is the harvest: it is the easiest activity to skip and the most important to keep."},{"problem":"It says most of my points are lag.","causes":["Your points came from results (referrals received, closed business) rather than lead activity."],"fix":"Add lead activity such as meetings, introductions, and asks. Lead is future business, so too much lag means your pipeline may slow down."}],"faqs":[{"q":"What is the difference between lead and lag points?","a":"Lead points come from activity you control (handshakes, high-value meetings, follow-throughs, introductions) and drive future business. Lag points come from results (referrals received, closed business). In Danny's coaching, lead is the seed and results are the harvest."},{"q":"What do the four insights mean?","a":"Strength is what you are doing well. Risk is what to watch before it costs you. Recommendation is your single highest-leverage next move. This Week's Identity is the mindset and tier you are operating at."},{"q":"Why does SWH emphasize follow-through so much?","a":"Handshakes are the seed, follow through is the harvest. A conversation with no follow-through is a missed connection, and follow-through is the easiest thing to skip when you get busy."},{"q":"What is the highest-leverage activity?","a":"Connecting people. Making introductions compounds your network faster than anything else, which is why the Recommendation often nudges you toward 2 to 3 intros."},{"q":"How often should I check Coaching?","a":"After you log your day, so the move is fresh, and again at the start of a new week to set your focus."},{"q":"What are the tiers?","a":"Weekly point levels (up through Professional and Master Networker) each with an identity message. Higher consistency compounds your momentum week over week."}],"related":["scorecard-home-daily-log","scoring-points-tiers-lead-lag","scorecard-scoreboard-stats","crm-wasted-handshakes"]},{"id":"swh-billing-subscription","product":"swh","category":"Account","title":"Try SWH free, subscribe, and manage your billing","audience":"Networker","summary":"Explore SWH in demo mode with sample data for free, start your 60-day trial when you hit a save action, then subscribe or manage your plan from the Subscription row in Account.","keywords":["billing","subscription","subscribe","free trial","60-day trial","60-day free trial","demo mode","Try for free","sample data","manage subscription","Manage subscription","Subscription","Account","Start free trial","paywall","upgrade","Scorecard","Scorecard CRM","RevenueCat","Stripe","billing portal","restore purchases","Delete Account","Reset my data","cancel subscription","$10/mo","$25/mo","Start 60-day free trial"],"overview":{"what":"SWH lets you try the app free in demo mode (sample data plus a banner), start a 60-day free trial the moment you try to save real activity, and then subscribe or manage billing from the Subscription row in your Account settings. Web subscriptions run through Stripe, and iOS subscriptions run through Apple's in-app purchase (RevenueCat).","why":"Handshakes are the seed, follow-through is the harvest, and the only way to know if your follow-through is paying off is to track your real activity over time. Demo mode lets you see how the scorecard works, but it is sample data only. Once you save your own lead points (the proactive activity you control that predicts future business), your tier and goal start reflecting your real week. Consistency beats intensity, so getting your real numbers in front of you is what turns the app into a habit.","who":"Any networker evaluating SWH, plus existing subscribers who need to change, upgrade, or cancel their plan, or update a payment method."},"steps":[{"title":"Open the app and tap Try for free","body":"On the sign-in screen, tap Try for free. SWH drops you into demo mode and loads sample data so you can browse the home scorecard, activities, history, and stats without creating an account. Your name shows as Demo Mode and a gold banner reads You're exploring with sample data."},{"title":"Explore the sample scorecard","body":"Tap around the home screen, the activity log, and the stats views to see how lead points (proactive activity you control, like meetings, FORM conversations, follow-throughs, 1:1s, and introductions) roll up into a weekly tier. Nothing you see here is saved, it is just a guided tour of the real layout."},{"title":"Trigger the trial by saving real activity","body":"Any write action in demo mode is gated behind the paywall. The moment you try to save a day, log a result, set a goal, edit a day, turn on SMS reminders, or use the calendar, SWH opens a contextual paywall with a headline that matches what you were doing (for example Save your real numbers, Set your real weekly goal, or Turn on real reminders). This is by design, so your first real save starts your trial."},{"title":"Start your free 60-day trial","body":"On the paywall, tap Start free trial (web). You create or sign in to your account (Continue with Google is the fastest way to create one) and SWH starts your 60-day free trial. On iPhone you complete the purchase through Apple's standard subscription sheet instead."},{"title":"Find your plan in Account","body":"Open Account (Settings). The Subscription row shows your current plan and status. Before you subscribe it reads Subscribe with the sub-label Start 60-day free trial. Once active it switches to your plan name, for example Scorecard with Manage subscription, or Scorecard CRM. On iPhone the row reads Account and shows your status without prices, per Apple's rules."},{"title":"Manage or cancel an active subscription","body":"Tap the Subscription row. On the web this opens the Stripe billing portal, where you can update your card, see invoices, change plans, or cancel. On iPhone, manage or cancel through your Apple ID subscriptions in iOS Settings, and use the restore prompt on the Subscription row if you reinstalled or switched devices (it offers to restore purchases)."},{"title":"Optional: reset data or delete your account","body":"In the Scorecard CRM, the Reset my data action clears all of your logged activity days (it asks This will delete all your logged activity days. This cannot be undone. Continue?). Separately, Delete Account permanently removes your account and all logged data and cannot be undone. Use these only when you really mean it."}],"expectedResult":"You can explore SWH for free in demo mode, and when you save your first real activity the paywall starts your 60-day free trial. After subscribing, the Subscription row in Account shows your active plan, and tapping it lets you manage or cancel (Stripe billing portal on web, Apple ID subscriptions on iPhone).","commonMistakes":["Logging activity in demo mode and expecting it to stick. Demo data is sample data only, and nothing saves until you start your trial. The paywall that appears when you save is the doorway, not an error.","Treating the paywall as a wall. It is showing because you are still in demo mode. Once your real save kicks off the 60-day free trial, those same actions just save quietly.","On iPhone, looking for a cancel or change-card button inside SWH. iOS subscriptions are managed through your Apple ID subscriptions in iOS Settings, not inside the app.","Confusing Reset my data with Delete Account. Reset my data only clears your logged activity days. Delete Account removes your entire account and all data permanently.","Assuming you only count results. Lag points (referrals received, deals won) are results already in hand, but it is lead points that move your tier and goal, so log the proactive activity too."],"troubleshooting":[{"problem":"A paywall pops up every time I try to save in demo mode.","causes":["You are still in demo mode (Demo Mode shown as your name, sample-data banner visible).","You have not started your trial or signed in yet."],"fix":"That is expected. Tap Start free trial on the paywall and sign in (Continue with Google is fastest). Once your 60-day trial starts, saving a day, setting a goal, and the other write actions stop prompting and just save."},{"problem":"Tapping the Subscription row does nothing or says to sign in first.","causes":["You are signed out or still anonymous in demo mode.","The billing portal is still loading."],"fix":"Make sure you are signed in to your real account (not Demo Mode), then tap the Subscription row again. On the web you will see Opening billing portal and be taken to Stripe. If it still fails, check your connection and retry, or contact support."},{"problem":"I subscribed on one device and the new device says my subscription is required.","causes":["Purchases have not been restored on the new device (iPhone).","You signed in with a different account than the one that holds the subscription."],"fix":"On iPhone, tap the Subscription row and accept the prompt to restore purchases, and confirm you are signed in with the same account you subscribed with. On the web, sign in with the account that holds the subscription and the Subscription row will show your active plan."},{"problem":"I cannot find where to cancel.","causes":["You are on iPhone, where cancellation lives in Apple's settings, not in the app.","You are not signed in on the web."],"fix":"On the web, tap the Subscription row to open the Stripe billing portal and cancel there. On iPhone, cancel through your Apple ID subscriptions in iOS Settings. Your access continues until the end of the current period."}],"faqs":[{"q":"Is demo mode really free, and do I need an account?","a":"Yes. Tap Try for free to explore SWH with sample data, no account or card required. You only create an account when you start your trial by saving real activity."},{"q":"How long is the free trial?","a":"60 days. You are not charged until the trial ends, and you can cancel anytime before then."},{"q":"What does SWH cost after the trial?","a":"The Scorecard plan is $10/mo and the Scorecard CRM plan is $25/mo. The exact pricing shown on your Subscription row reflects the plan you are starting."},{"q":"Does my demo activity carry over when I subscribe?","a":"No. Demo mode is sample data for exploring the app. Your real tracking starts fresh when you begin saving your own activity during the trial."},{"q":"How do I cancel or change my plan?","a":"On the web, tap the Subscription row in Account to open the Stripe billing portal, where you can change plans, update your card, or cancel. On iPhone, manage or cancel through your Apple ID subscriptions in iOS Settings."},{"q":"Why does the iPhone version not show prices in Account?","a":"On iPhone the Subscription row shows your status (for example Account, active) without prices or marketing copy, in line with Apple's App Store rules. Pricing and purchase happen through Apple's in-app purchase sheet."},{"q":"What is the difference between Reset my data and Delete Account?","a":"Reset my data (in the Scorecard CRM) clears all of your logged activity days but keeps your account. Delete Account permanently removes your entire account and all logged data. Both ask you to confirm and cannot be undone."},{"q":"I switched phones and lost access. What do I do?","a":"On iPhone, tap the Subscription row and accept the offer to restore purchases, signing in with the same account you used to subscribe. Your active plan will reappear."}],"related":["scoring-points-tiers-lead-lag","swh-sign-in-auth","crm-network-contacts","swh-teams","scorecard-coaching-insights"]},{"id":"swh-daily-reminders","product":"swh","category":"Settings","title":"Set up daily reminders: push, email, SMS, and calendar","audience":"Networker","summary":"Turn on one or more daily reminder channels (push, email, SMS, or a recurring Google Calendar event) so you get a nudge to log your activity on any day you haven't logged yet.","keywords":["daily reminders","push notifications","Daily Email Reminder","SMS Reminders","Calendar Reminder","togglePushReminder","toggleEmailReminder","openSmsModal","Google Calendar","recurring event","5PM reminder","Enable SMS Reminders","Enable Calendar Reminder","Reminder Time","reminder if you haven't logged","log my activity","streak","follow-through reminder","Settings"],"overview":{"what":"SWH gives you four separate daily-reminder channels in Settings: Push Notifications, Daily Email Reminder, SMS Reminders, and Calendar Reminder. Each one nudges you to log your activity, and (except for the calendar event, which is just a recurring placeholder on your calendar) they only fire on days you have not already logged. You can turn on as many as you want.","why":"Follow-through is the easiest activity to skip and the most important to keep. A reminder is the small mechanism that turns intention into a logged lead point, and lead points (the proactive activity you control) are what move your tier and predict future business. Consistency beats intensity, so a daily nudge that catches you only on the days you have not logged keeps your streak alive without becoming noise. Handshakes are the seed, follow through is the harvest, and these reminders keep you harvesting.","who":"Any networker who wants a daily prompt to log. Push, email, and the calendar event are available channels in Settings; SMS Reminders and the Calendar Reminder require a paid plan (Scorecard Pro), and a couple of channels depend on whether you are on the iOS app or the web app (see steps)."},"steps":[{"title":"Open Settings","body":"Tap or click into Settings in SWH. Scroll to the reminder rows. Depending on whether you are on the iOS app or the web app, you will see some combination of Push Notifications, Daily Email Reminder, SMS Reminders, and Calendar Reminder. You can enable more than one."},{"title":"Turn on Push Notifications (iOS app only)","body":"On the SWH iOS app, find the Push Notifications row (the sub-label reads \"Daily 5PM reminder · off\"). Tap the toggle on. You will see a \"Push reminders on\" confirmation, and the sub-label flips to on. This sends a native push at 5PM on any day you have not logged. This row does not appear on the web version, where you should use email or the calendar reminder instead."},{"title":"Turn on the Daily Email Reminder","body":"Find the Daily Email Reminder row (sub-label \"5PM reminder if you haven't logged · off\"). Tap the toggle on. You will see an \"Email reminders on\" confirmation. SWH emails you at 5PM only on days you have not logged any points, using the email tied to your account. No extra setup, no address to type in."},{"title":"Set up SMS Reminders (paid plan)","body":"Tap the SMS Reminders row to open the SMS Reminders panel. It explains you will get a text at 5pm Mon–Fri only if you haven't logged your points. Enter your 10-digit mobile number in the field (the +1 country code is already shown for you), flip the Enable SMS Reminders toggle on, and tap Save. You will see an \"SMS reminders on\" confirmation. SMS is a Pro feature, so if you are on the free or demo plan, tapping Save opens the upgrade screen instead."},{"title":"Set up a Calendar Reminder (web app, paid plan)","body":"On the web app, tap the Calendar Reminder row to open the Calendar Reminder panel. It adds one recurring 5-minute event to your Google Calendar, daily, on your primary calendar (no spam). Flip Enable Calendar Reminder on, pick a time from the Reminder Time dropdown (options run from 6:00 AM to 9:00 PM, default 7:00 PM), then tap Save."},{"title":"Approve Google Calendar access when prompted","body":"After you tap Save with the calendar reminder enabled, Google asks you to sign in and grant calendar access. Approve it. SWH then creates the recurring daily event (titled \"📊 SWH Scoreboard, log today\") with a popup reminder, and you will see a confirmation that your daily reminder is set for the time you chose. If you are on the iOS app, the calendar reminder is set up on the web instead: SWH will prompt you to open swh-scoreboard.web.app in your browser to connect your calendar."},{"title":"Adjust or turn a reminder off later","body":"Come back to the same Settings rows any time. For push and email, tap the toggle off to stop them. For SMS, reopen the panel, turn off Enable SMS Reminders, and Save. For the calendar reminder, reopen the panel, change the Reminder Time and Save to move it, or turn Enable Calendar Reminder off and Save to delete the recurring event from your Google Calendar."}],"expectedResult":"Each channel you enabled shows as on in Settings. On days you have not logged your activity, you receive your chosen nudge(s): a 5PM push (iOS), a 5PM email, and/or a 5pm Mon–Fri text. If you set up the calendar reminder, a recurring daily \\\"📊 SWH Scoreboard, log today\\\" event now sits on your primary Google Calendar at the time you picked, with a popup reminder. The reminders stop on any given day as soon as you log, so they only ever catch you on the days you actually skipped.","commonMistakes":["Expecting reminders on days you already logged. Push, email, and SMS fire only on days you have not logged, so once you log your points that day's nudge is suppressed (by design). They are skip-catchers, not daily alarms.","Looking for Push Notifications on the web. The Push Notifications row only appears in the SWH iOS app. On the web, use the Daily Email Reminder or the Calendar Reminder instead.","Trying to set up the Calendar Reminder from the iOS app. The Google sign-in popup does not work cleanly inside the app, so SWH tells you to open swh-scoreboard.web.app in your browser and finish there.","Tapping Save on SMS or Calendar Reminder while on the free or demo plan and being surprised by the upgrade screen. Both are Pro features, so enable them after upgrading.","Entering your phone number with the country code or extra characters. Just type the 10 digits; the +1 is already added for you."],"troubleshooting":[{"problem":"I never get the push, email, or SMS reminder","causes":["You already logged your activity that day, so the reminder was correctly suppressed","The channel toggle is actually off (check that the Settings row shows on)","For SMS, the number was not saved or the Enable SMS Reminders toggle was left off","For SMS, you are on a free or demo plan, so Save opened the upgrade screen instead of saving","Push only works on the iOS app, and email goes to the address on your account"],"fix":"Open Settings and confirm the specific channel shows as on. For SMS, reopen the SMS Reminders panel, re-enter your 10-digit number, turn Enable SMS Reminders on, and Save until you see the \"SMS reminders on\" confirmation. Make sure you are on a paid plan for SMS. Remember that all three of these fire only on days you have not logged, so test by leaving a day unlogged until the reminder time."},{"problem":"The Calendar Reminder won't save or no event appears on my calendar","causes":["You did not approve Google Calendar access in the sign-in popup, or it was denied","A browser popup blocker stopped the Google sign-in window","You tried to set it up from the iOS app, where the popup flow is redirected to the web","You are on the free or demo plan, so Save opened the upgrade screen","A temporary Google connection error"],"fix":"Use the web app at swh-scoreboard.web.app, allow popups, then reopen the Calendar Reminder panel, enable it, pick a Reminder Time, and Save. Complete the Google sign-in and grant calendar access when prompted. On a paid plan you should then see a confirmation that your daily reminder is set, and a recurring \"📊 SWH Scoreboard, log today\" event on your primary Google Calendar. If it fails, try Save again to re-trigger the connection."},{"problem":"I want to change the time my reminder fires","causes":["Push, email, and SMS run on fixed schedules (push and email at 5PM, SMS at 5pm Mon–Fri) and have no time picker","Only the Calendar Reminder lets you choose the hour"],"fix":"If you need a specific time of day, use the Calendar Reminder and pick from the Reminder Time dropdown (6:00 AM to 9:00 PM). Reopen the panel, change the time, and Save to move the existing recurring event. The push, email, and SMS times are fixed and cannot be changed."}],"faqs":[{"q":"Do the reminders go off even on days I already logged?","a":"No. Push, email, and SMS fire only on days you have not logged your activity yet. Once you log that day, the nudge is suppressed. The Google Calendar event is the one exception: it is a fixed recurring placeholder, so it shows on your calendar every day regardless, as a standing prompt."},{"q":"Can I turn on more than one channel at once?","a":"Yes. Push, email, SMS, and the calendar event are independent toggles. Turn on as many as you find helpful. Many people pair the calendar event (a visible block on their day) with one of the day-of nudges."},{"q":"Why don't I see the Push Notifications option?","a":"Push Notifications only appear in the SWH iOS app. On the web app that row is hidden. Use the Daily Email Reminder or the Calendar Reminder on the web instead."},{"q":"What time do the reminders arrive?","a":"Push and the Daily Email Reminder fire at 5PM on unlogged days. SMS sends at 5pm Mon–Fri if you haven't logged. The Calendar Reminder is the only one with a time you choose, from 6:00 AM to 9:00 PM (it defaults to 7:00 PM)."},{"q":"Are SMS and the Calendar Reminder free?","a":"No. SMS Reminders and the Calendar Reminder are Scorecard Pro features. If you tap Save on either while on the free or demo plan, SWH opens the upgrade screen. Push and email reminders are available without those gates."},{"q":"What exactly does the Calendar Reminder put on my calendar?","a":"One recurring 5-minute event on your primary Google Calendar, daily, titled \"📊 SWH Scoreboard, log today,\" with a popup reminder at the start time and a link back to the Scoreboard. It carries the line \"Handshakes are the seed. Follow through is the harvest.\" One recurring event, no spam."},{"q":"How do I stop getting a reminder?","a":"In Settings, toggle Push Notifications or Daily Email Reminder off. For SMS, reopen the SMS Reminders panel, turn off Enable SMS Reminders, and Save. For the calendar event, reopen the Calendar Reminder panel, turn Enable Calendar Reminder off, and Save, which deletes the recurring event from your Google Calendar."},{"q":"Why bother with a daily reminder at all?","a":"Because follow-through is the easiest activity to skip and the most important to keep. Logging consistently is what builds your lead points, and lead points are the proactive activity that moves your tier and predicts future business. Results tell you what happened; activity tells you what will happen. A daily nudge keeps the activity flowing."},{"q":"Can I set up the Calendar Reminder from my iPhone app?","a":"Not directly. The Google sign-in popup does not work cleanly inside the iOS app, so SWH will prompt you to open swh-scoreboard.web.app in your browser and finish the calendar setup there. Once created, the recurring event shows on your Google Calendar everywhere, including your phone."}],"related":["scorecard-coaching-insights","scoring-points-tiers-lead-lag","crm-network-contacts","swh-teams","swh-sign-in-auth"]},{"id":"swh-team-dashboard","product":"swh","category":"Teams","title":"Run and coach your team from the Team Dashboard","audience":"Team owner or co-lead","summary":"Use the Team Dashboard to invite members, watch today's activity roll in, and drill into any member to log activity, tune their points, and coach them toward more lead activity.","keywords":["Team Dashboard","team tab","invite member","Add Member","Invite","proration","seat count","Members","Pending Invites","Today's Activity","activity feed","member detail","Points Today","This Week","Day Streak","Log Activity","Save Points","edit points for member","weekly recap email","Save Schedule","Push Activity to All Members","Push to All Members","Team Weekly Report","co-lead","owner","lead points","lag points","coaching","remove member"],"overview":{"what":"The Team Dashboard is the screen where a team owner or co-lead runs the whole team. At the top is a summary card showing Points Today, Members, and Active Today. Below it you can invite teammates by email, see your full Members roster, watch Pending Invites, and follow a live Today's Activity feed. Tapping any member opens a detail overlay with their KPIs (Today, This Week, Day Streak) and three tabs (History, Activities, Schedule) where you can log activity on their behalf, edit point values for that member only, and set their weekly recap email. Owners and co-leads can also push a single activity to every member at once.","why":"Handshakes are the seed. Follow through is the harvest. The dashboard exists so you can coach the harvest, not just admire the seeds. The Today's Activity feed and each member's KPIs separate lead points (proactive activity your people control, like meetings, FORM conversations, follow-throughs, 1:1s, and introductions, which predict future business) from lag points (results already in hand). Results tell you what happened. Activity tells you what will happen. When you watch the feed and drill into a member, you can spot who is consistent, who has gone quiet, and who needs a nudge toward the highest-leverage move of all, connecting people.","who":"Team owners and co-leads on a paid team plan. Every member can see the Team Dashboard and the activity feed, but only owners and co-leads can invite, drill into members, edit per-member points, set a member's recap schedule, and push an activity to all members."},"steps":[{"title":"Open the Team Dashboard","body":"Tap Team in the navigation to open the Team Dashboard. The summary card at the top shows your team name plus three numbers: Points Today, Members, and Active Today. Active Today counts how many distinct teammates have logged anything yet, so a low number first thing in the morning is normal and a low number at 4pm is a coaching signal."},{"title":"Invite a teammate by email","body":"In the Add Member card, type your teammate's email into the teammate@example.com field and tap Invite. The hint reads \"Adding a member bumps your seat count. Stripe prorates immediately,\" so you only pay the prorated difference for the rest of the billing period. If the email already has an account you'll see a confirmation that they were added; otherwise an invite is sent and they show up under Pending Invites until they accept."},{"title":"Watch Pending Invites and the Members roster","body":"Anyone you invited who hasn't joined yet appears under Pending Invites marked \"Invite sent, pending acceptance.\" Once they accept, they move up into the Members list. The roster is sorted by points today, so your most active people rise to the top and quiet ones sink, which makes the day's leaders and laggards obvious at a glance."},{"title":"Read the Today's Activity feed","body":"Scroll to Today's Activity to see each logged event with the member's name, a TODAY or YESTERDAY tag, and a breakdown reading \"X lead, Y lag pts.\" Lead points are the proactive moves your people control and the ones that move their tier and goal, so coach toward the lead number. Consistency beats intensity, a steady stream of small lead activity beats one big day."},{"title":"Tap a member to open their detail","body":"Tap any teammate in the Members roster (owners and co-leads only) to open their detail overlay. The KPI row shows their Points Today, This Week, and Day Streak. Use the streak to praise consistency and the weekly number to see whether they're trending toward a higher tier (Getting Started 0 to 49, Active Networker 50 to 99, Consistent Connector 100 to 149, Professional Networker 150 to 199, Master Networker 200+, all from weekly lead points)."},{"title":"Log activity for a member from the History tab","body":"On the History tab, tap \"+ Log Activity.\" Pick a Date, choose the Activity, set a Count, and tap Save. This is for when a teammate tells you about a meeting or referral they forgot to enter. Follow-through is the easiest activity to skip and the most important to keep, so logging it for them keeps the truth in the scorecard. You can also tap a past day in their history to open the edit-day view and set exact counts per activity."},{"title":"Edit point values for that member on the Activities tab","body":"Open the Activities tab to adjust how many points each activity is worth for this member only. The note reads \"Edit point values for this member only. Changes don't affect other members.\" Make your changes and tap Save Points. Use this sparingly to reflect a member's real role, for example weighting introductions higher since connecting people is the highest-leverage activity there is."},{"title":"Set the member's weekly recap on the Schedule tab","body":"Open the Schedule tab to turn on \"Send weekly email\" for that member, pick a Day and Time (the member's timezone is shown), and tap Save Schedule. This gives each teammate a personal recap that nudges them to keep moving without you chasing them one by one."},{"title":"Push an activity to all members at once","body":"Back on the dashboard, in the Team settings card tap \"Push Activity to All Members.\" Set an Icon, an Activity Name, the Points, and the Type (Lead for future business or Lag for current results), then tap \"Push to All Members.\" The activity is added to every member's list and anyone who already has it is skipped, so the whole team can start tracking a new behavior on the same day."},{"title":"Turn on the Team Weekly Report (optional)","body":"In the Team settings card tap Team Weekly Report, toggle \"Send the report\" on, choose a Day and Time, and tap Save. This summary email goes to the owner and all co-leads so the leadership group gets one shared view of the week without anyone pulling numbers by hand."}],"expectedResult":"You can invite teammates (with seats and billing prorating automatically), see Points Today, Members, and Active Today on the summary card, follow every logged event in the Today's Activity feed, and open any member to view their KPIs, log activity on their behalf, tune their points, and set their weekly recap. Owners and co-leads can also push one activity to the entire team in a single step.","commonMistakes":["Coaching the lag number instead of the lead number. The big point totals in the feed feel impressive, but lag points are results already banked. Lead points are the proactive activity that predicts future business and moves a member's tier, so that's the number to grow.","Treating Active Today as a vanity metric. It's a coaching signal. If most of the team hasn't logged anything by mid-afternoon, that's the moment to nudge, not after the day is gone.","Assuming a per-member point change applies to everyone. The Activities tab edits points for that one member only, by design. To change an activity for the whole team, use Push Activity to All Members instead.","Forgetting that invites cost a prorated seat right away. Adding a member bumps your seat count and Stripe prorates immediately, so invite people you actually intend to keep on the roster.","Logging activity for a member to inflate the board. The dashboard is for capturing real follow-through a teammate forgot to enter, not for padding numbers. Activity only tells you what will happen if it's true."],"troubleshooting":[{"problem":"I don't see the Add Member card, the Members aren't tappable, or there's no Push Activity option.","causes":["You're a regular member, not the owner or a co-lead","Your role hasn't finished loading after sign-in"],"fix":"Only the owner and co-leads see the invite card, can tap into member details, and can push activities. Confirm your role (the owner shows an OWNER badge and co-leads a CO-LEAD badge in the roster). If you should be a co-lead, ask the team owner. If your role looks wrong, fully sign out and back in so the dashboard reloads your permissions."},{"problem":"I invited someone but they never showed up in Members.","causes":["They haven't accepted the invite yet","The email was mistyped","They signed up or signed in with a different email than the one you invited"],"fix":"Check the Pending Invites section, an unaccepted invite sits there marked \"pending acceptance.\" Confirm the address is spelled correctly and that your teammate is using that exact email. Once they accept with the matching email, they move from Pending Invites up into the Members roster automatically."},{"problem":"The activity I pushed didn't appear on some members' lists.","causes":["Those members already had an activity with that name, so they were skipped","The push only just completed and their app hasn't refreshed"],"fix":"Push Activity to All Members intentionally skips anyone who already has that activity, so a lower \"pushed to N members\" count is expected, not an error. Ask those members to reopen the app to pull the latest list. To add it for everyone with different points, you'd need to adjust per member on each member's Activities tab."},{"problem":"I changed a member's points on the Activities tab but the team board didn't move for everyone.","causes":["Per-member point edits apply to that member only","You expected a team-wide change"],"fix":"This is working as designed, the Activities tab note says changes don't affect other members. Per-member edits only re-score that person. For a change that touches the whole team, use Push Activity to All Members or edit each member individually."}],"faqs":[{"q":"Does inviting a member cost me anything right away?","a":"Yes. Adding a member bumps your seat count and Stripe prorates the difference immediately for the rest of your billing period, so you're charged only for the time remaining. Removing a member drops your seat count back down."},{"q":"What's the difference between lead points and lag points in the feed?","a":"Lead points are proactive activity your people control, like meetings, FORM conversations, follow-throughs, 1:1s, introductions, and giving referrals. They predict future business and move a member's tier and goal. Lag points are results already in hand, like referrals received and deals won. Results tell you what happened, activity tells you what will happen, so coach the lead number."},{"q":"Can I log activity for a teammate who forgot to enter it?","a":"Yes. Open the member's detail, go to the History tab, tap \"+ Log Activity,\" pick the date, activity, and count, and save. You can also tap a past day to set exact counts per activity. This keeps real follow-through, the easiest thing to skip and the most important to keep, on the board."},{"q":"If I change a member's point values, does it affect the rest of the team?","a":"No. The Activities tab edits point values for that one member only, and the screen says so. To roll out a change to everyone, use Push Activity to All Members from the Team settings card instead."},{"q":"What does Push Activity to All Members do, and who can use it?","a":"Owners and co-leads can push a single activity (icon, name, points, and Lead or Lag type) to every member's list at once. Members who already have an activity by that name are skipped, so the whole team can start tracking a new behavior the same day. It's the fastest way to get everyone connecting people or following up consistently."},{"q":"Who gets the weekly emails?","a":"There are two. Each member's weekly recap, set on that member's Schedule tab, goes to that member. The separate Team Weekly Report goes to the owner and all co-leads so leadership shares one view of the week."},{"q":"What do the tiers on a member's KPIs mean?","a":"Tiers come from weekly lead points: Getting Started 0 to 49, Active Networker 50 to 99, Consistent Connector 100 to 149, Professional Networker 150 to 199, and Master Networker 200+. Use a member's This Week number and Day Streak to coach consistency, because consistency beats intensity."},{"q":"Why is Active Today lower than my member count?","a":"Active Today counts only the teammates who have logged something so far today, so it's naturally low in the morning and fills in as the day goes. A low number late in the day is your cue to nudge people to log their activity before they lose it."}],"related":["swh-teams","scoring-points-tiers-lead-lag","scorecard-coaching-insights","crm-network-contacts","swh-sign-in-auth"]},{"id":"crm-lola-assistant","product":"swh","category":"Getting started","title":"Ask Lola in the CRM: build playbooks, get a daily brief, draft outreach","audience":"Pro CRM user","summary":"Tap the Ask Lola button in your Pro CRM to open a chat where Lola builds follow-through playbooks, tells you what to do next from your overdue and due steps, and drafts outreach messages you can copy and send.","keywords":["Ask Lola","Lola","AI assistant","follow-through co-pilot","build a playbook","Build with Lola","What should I do next?","daily brief","draft outreach","Copy message","Save playbook","Tweak first","FAB","playbook","CRM assistant","8-step cadence","follow-through"],"overview":{"what":"Ask Lola is a Pro-gated AI assistant built into your Scorecard CRM. You launch it from the floating Ask Lola button, and a slide-out chat panel (titled Lola, Your follow-through co-pilot) opens on the right. From there you can use two quick chips or type freely to do three things: build an 8-step follow-through playbook for a relationship type, get a What should I do next? daily brief pulled from your own overdue and due steps, and draft outreach messages you can copy with one tap.","why":"Handshakes are the seed. Follow through is the harvest. A met contact is only potential until you actually follow up, and follow-through is the easiest activity to skip and the most important to keep. Lola removes the two excuses people use to skip it: not knowing what to say and not knowing who to touch next. Playbooks turn every new contact into a repeatable 8-step cadence, the daily brief points you at the contacts who are slipping, and drafted messages mean you are never staring at a blank text box. Results tell you what happened. Activity tells you what will happen, and Lola exists to keep your lead-point activity (follow-throughs, outreach, introductions) consistent.","who":"Pro CRM users. Lola is included with the Scorecard CRM (Pro) plan. If you are on the free Scorecard, the Ask Lola button is hidden and you will be prompted to upgrade."},"steps":[{"title":"Open Lola from the Ask Lola button","body":"Look for the floating Ask Lola button in your CRM (it stays pinned on screen as you move between tabs). Tap it to slide open the Lola panel, titled Lola with the subtitle Your follow-through co-pilot. On your first open, Lola greets you by name and explains she can build playbooks, write outreach, or help you pick what to do next."},{"title":"Get your daily brief with the What should I do next? chip","body":"Tap the 🌅 What should I do next? quick chip at the top of the chat. Lola reads your own contacts, finds everyone whose follow-through clock has started and who has an overdue (late) step, and comes back with a prioritized brief of who to touch and which step is next. This is your lead-point to-do list for the day, drawn straight from real contacts, not a generic checklist."},{"title":"Build a playbook with the Build a playbook chip","body":"Tap the ✨ Build a playbook chip. Lola pre-fills the message box with Build me a playbook for and puts your cursor at the end. Finish the sentence with the relationship type, for example Build me a playbook for referral partners I want reciprocal referrals with, then press Send. Lola drafts a complete 8-step cadence tuned to that relationship."},{"title":"Review the playbook draft, then Tweak first or Save","body":"Lola returns the draft as a card inside the chat showing all 8 steps, each with its day offset (Day X) and point value. Tap ✏️ Tweak first to open the full playbook editor and adjust names, timing, or points before saving, or tap 💾 Save playbook to add it to your library as-is. Once saved, you can assign it to any contact from their card so it drives their 8-step clock."},{"title":"Draft outreach by asking Lola in plain language","body":"Type a request like Write a follow-up text to Sarah after we met at the chamber lunch into the Ask Lola anything… box and press Send (or Enter). Lola drafts the message and shows it inside a clearly marked Message block in the chat so you can read it in context with her notes."},{"title":"Copy the drafted message and send it","body":"Under a drafted message, tap the 📋 Copy message button. Lola copies only the message text (not her surrounding chatter) to your clipboard, and the button briefly flips to ✅ Copied. Paste it into your email or texting app and send. On replies that are not a formal draft, the button reads 📋 Copy and copies the whole response."},{"title":"Or start from Settings: Create New Playbook, Build with Lola","body":"You can also reach playbook-building outside the chat. Go to Settings, find Follow-Through Playbooks, tap Create New Playbook, then choose Build with Lola (marked Recommended). This opens the Lola chat with the build prompt ready. The alternate option, Start from scratch, opens a blank 8-row editor instead if you would rather build it by hand."}],"expectedResult":"The Lola panel opens from the Ask Lola button. The daily brief returns a prioritized list of your overdue and next-up steps by contact name. A playbook request returns an editable 8-step draft card you can Tweak first or Save playbook into your library. An outreach request returns a drafted message you can Copy message to your clipboard with one tap and paste into email or text.","commonMistakes":["Looking for Lola on the free Scorecard. Lola is Pro-only, so the Ask Lola button only appears on the Scorecard CRM (Pro) plan. On free, the button is hidden and you will see an upgrade prompt.","Copying the whole chat by hand instead of using the Copy message button. The 📋 Copy message button copies only the clean message text, so the recipient never sees Lola's notes. Copy-pasting the bubble yourself can drag in her surrounding commentary.","Expecting the daily brief to cover contacts whose clock has not started. The brief only looks at contacts whose follow-through clock has been started and who have a late step, so brand-new contacts you have not begun a cadence for will not appear there.","Saving a generic playbook draft without tweaking the timing or points. The draft is a starting point. Use ✏️ Tweak first to match your real cadence, since lead points on these steps are what move your weekly tier."],"troubleshooting":[{"problem":"The Ask Lola button is not showing up anywhere in the CRM.","causes":["You are on the free Scorecard plan rather than Scorecard CRM (Pro)","Your plan status has not finished loading yet right after sign-in"],"fix":"Confirm you are on the Pro plan. Lola is included with Scorecard CRM, so upgrading unlocks the Ask Lola button. If you just signed in or just upgraded, give the app a moment to load your plan or refresh, and the button will appear."},{"problem":"Tapping Ask Lola shows a toast that says Lola is included with Scorecard CRM. Upgrade to unlock, instead of opening the chat.","causes":["Your account is not on the Pro plan"],"fix":"Upgrade to Scorecard CRM (Pro). Lola is part of the Pro plan, and once your plan is active the button opens the chat panel normally."},{"problem":"Lola replies with an error like Try signing in again or a connection hiccup message.","causes":["Your sign-in session token expired (a 401 from the assistant)","A network drop while the request was in flight","A temporary backend hiccup with the assistant service"],"fix":"If it mentions signing in, sign out and back in to refresh your session, then try again. For a connection hiccup, check your internet and resend the same message. Most transient errors clear on a second attempt a moment later."},{"problem":"Lola talks back but never produces a playbook card.","causes":["Your message did not read as a build request, so it was treated as freeform chat","You described a single message rather than a relationship cadence"],"fix":"Use the ✨ Build a playbook chip, or phrase your message so it clearly asks for a playbook (start with Build, Make, or Create, or include the word playbook). For example, Create a playbook for new referral partners. That routes the request to playbook mode and returns the 8-step draft card."},{"problem":"The Copy message button did not put anything on my clipboard.","causes":["Clipboard access was blocked by the browser or device","You tapped before the draft finished rendering"],"fix":"Tap the button again and watch for it to flip to ✅ Copied, which confirms the copy succeeded. If your browser blocks clipboard access, the app falls back to a manual copy, but you can always select the text inside the Message block and copy it by hand as a backup."}],"faqs":[{"q":"Do I need Pro to use Lola?","a":"Yes. Lola is included with the Scorecard CRM (Pro) plan. On the free Scorecard the Ask Lola button is hidden, and tapping any upgrade prompt will let you unlock it."},{"q":"How does the What should I do next? daily brief decide who to surface?","a":"It scans your contacts whose follow-through clock has started, finds the ones with an overdue (late) step, and reports the next step for each. It is built from your real contacts and their 8-step cadence, so it is a true to-do list, not a generic tip. Following through on those steps is lead-point activity, which is what predicts your future business and moves your weekly tier."},{"q":"What exactly does a playbook contain?","a":"Every playbook is an 8-step follow-through cadence. Each step has a name, a day offset (when it is due relative to when the clock starts), and a point value. When you assign a playbook to a contact, those 8 steps drive that contact's clock."},{"q":"Can I edit a playbook Lola drafts before it goes live?","a":"Yes. On the draft card, tap ✏️ Tweak first to open the full editor and change names, timing, or points, or tap 💾 Save playbook to keep it as-is. Either way it lands in your library, and you assign it to contacts from their cards."},{"q":"How do I get a message I can actually send?","a":"Ask Lola in plain language, for example Write a thank-you text to John after our coffee. She drafts it and shows it in a Message block with a 📋 Copy message button. Tapping it copies only the message text to your clipboard, ready to paste into email or your texting app."},{"q":"Does the Copy button copy Lola's notes too?","a":"No. When Lola has drafted a message, Copy message copies only the message itself, leaving out her surrounding commentary. On general replies that are not a formal draft, the button reads Copy and copies the whole response."},{"q":"Is there another way to build a playbook without opening the chat first?","a":"Yes. Go to Settings, open Follow-Through Playbooks, tap Create New Playbook, and choose Build with Lola (Recommended) to launch the chat with the build prompt ready, or Start from scratch to hand-build a blank 8-step playbook."},{"q":"Does Lola see my actual contacts and steps?","a":"For the daily brief, yes. It uses your overdue and due steps and your contact names so the brief is specific to you. Lola is your follow-through co-pilot, so its job is to keep your follow-up, outreach, and introductions consistent, since consistency beats intensity."}],"related":["scorecard-coaching-insights","crm-network-contacts","scoring-points-tiers-lead-lag","swh-teams","swh-sign-in-auth"]},{"id":"crm-playbooks","product":"swh","category":"Settings","title":"Create and manage Follow-Through Playbooks","audience":"Pro CRM user","summary":"Build, edit, and assign 8-step Follow-Through Playbooks so each contact follows a follow-through cadence tuned to that relationship type.","keywords":["Follow-Through Playbooks","playbook","Manage Playbooks","Create New Playbook","Build with Lola","Start from scratch","8-step cadence","8 steps","default playbook","Set as Default Playbook","assign playbook","Follow-Through Playbook dropdown","day offset","points","step message","edit playbook","delete playbook","Settings","follow-through cadence","referral partner playbook","Save playbook","Tweak first"],"overview":{"what":"A Follow-Through Playbook is a named, 8-step follow-through cadence (each step has an icon, a day offset from when the clock starts, points, a name, and message copy). You can keep several playbooks for different relationship types and assign a specific one to each contact, so your follow-through runs on the right rhythm for that person.","why":"Handshakes are the seed. Follow through is the harvest. A met contact is only potential until you actually follow through, and follow-through is the easiest activity to skip and the most important to keep. Playbooks turn that consistency into a system: a referral partner, a past client, and a quick event contact should not all get the same cadence. Because follow-throughs are lead points (proactive activity you control that predicts future business), keeping every contact on a sensible playbook is what moves your weekly tier, since results tell you what happened but activity tells you what will happen.","who":"Pro CRM users on the Stop Wasting Handshakes app who manage contacts and want different relationship types to run on different follow-through cadences."},"steps":[{"title":"Open Follow-Through Playbooks in Settings","body":"Go to Settings and find the Follow-Through Playbooks section. You will see two rows: Manage Playbooks (with a sub-line showing how many playbooks you have and which one is your default) and Create New Playbook."},{"title":"Review your playbook library","body":"Tap Manage Playbooks to open the Follow-Through Playbooks manager. Each playbook shows as a card with its icon, name, and description, and your default is marked with a Default badge. Tap any card to open it in the editor."},{"title":"Start a new playbook","body":"Tap Create New Playbook (from Settings or from the Create New Playbook button inside the manager). You will be asked how you want to start: Build with Lola (Recommended) or Start from scratch."},{"title":"Option A: Build with Lola","body":"Choose Build with Lola. The Lola chat opens with \"Build me a playbook for\" prefilled. Finish the sentence by describing the relationship type (for example, brokers and agents you want reciprocal referrals with). Lola drafts 8 steps tailored to that cadence and shows them as a proposal. Tap Tweak first to open the draft in the full editor, or tap Save playbook to save it straight to your library."},{"title":"Option B: Start from scratch","body":"Choose Start from scratch to open a blank 8-row editor where you name every step, pick the cadence, and set the points yourself."},{"title":"Name the playbook and describe when to use it","body":"At the top of the editor, set an emoji icon and a Playbook name (for example, Referral Partner). In the description field, answer \"When should I use this playbook?\" so future-you knows which contacts it fits."},{"title":"Edit the 8 steps","body":"Under The 8 Steps, each row has: an emoji icon, a Day field (the day offset from when that contact's clock starts), the step name, a \"What does this step look like?\" box for the message copy or the action, and a Pts field for the points that step awards. A playbook always has exactly 8 steps. Every step needs a name before you can save."},{"title":"Decide whether this is your default","body":"Turn on Set as Default Playbook if you want new contacts to use this playbook unless you pick a different one. Only one playbook can be the default at a time, so setting this one as default removes the badge from your previous default."},{"title":"Save","body":"Tap Save. You will see a confirmation that the playbook was saved, and your contact cards refresh to reflect the playbook-derived steps."},{"title":"Assign a playbook to a specific contact","body":"Open the Add Contact or Edit contact form and use the Follow-Through Playbook dropdown to pick which playbook drives that person's cadence. If you do not change it, the contact uses your default playbook. Start that contact's clock to begin the cadence."},{"title":"Delete a playbook you no longer need","body":"Open the playbook in the editor and tap Delete (the Delete button only appears for non-default playbooks). Confirm when prompted. Any contacts that were assigned to that playbook automatically revert to your default playbook."}],"expectedResult":"Your playbook appears in the Manage Playbooks list and in the Follow-Through Playbook dropdown on the contact form. Each assigned contact follows the 8-step cadence from its playbook once its clock is started, with the right day offsets, points, and message copy, and the Settings sub-line reflects your playbook count and current default.","commonMistakes":["Saving with a blank step. A playbook must have all 8 steps named (and a playbook name). If any step name is empty, the save stops and tells you which step needs a name.","Building a playbook but never assigning it. Creating a playbook does not move any contact onto it. You still have to pick it in the Follow-Through Playbook dropdown on each contact (or set it as default so new contacts use it).","Expecting the cadence to run before the clock starts. The day offsets are measured from when a contact's clock starts, so a contact with no clock started will not show due steps yet.","Treating the points field like results. Follow-through steps are lead points (proactive activity), not lag points. They predict future business and move your tier, so set them to reward the activity, not to log a result."],"troubleshooting":[{"problem":"The Delete button is missing on a playbook I want to remove.","causes":["The playbook is currently set as your default, and the default cannot be deleted.","You are looking at an unsaved draft, which has nothing to delete yet."],"fix":"Open another playbook and turn on Set as Default Playbook (or create one and set it as default), then reopen the playbook you want to remove. With it no longer the default, the Delete button appears."},{"problem":"A new contact is not using the playbook I expected.","causes":["The contact's Follow-Through Playbook dropdown was left on the default.","A different playbook is set as your default, so new contacts inherit that one."],"fix":"Open the contact in Edit, pick the right playbook in the Follow-Through Playbook dropdown, and save. To change the default for all future contacts, open the intended playbook and turn on Set as Default Playbook."},{"problem":"I just created a playbook but it is not in the contact dropdown.","causes":["The contact form was already open before the playbook was saved.","The save did not complete."],"fix":"Close and reopen the Add/Edit contact form so the Follow-Through Playbook dropdown refreshes. Confirm the playbook is listed under Manage Playbooks; if it is not, open the editor and save again, watching for the saved confirmation."},{"problem":"My contacts moved to a different cadence after I deleted a playbook.","causes":["Deleting a playbook reassigns every contact that used it back to your default playbook by design."],"fix":"This is expected. If you want those contacts on a different cadence, reopen each one and choose the right playbook in the Follow-Through Playbook dropdown, or recreate the deleted playbook and reassign them."}],"faqs":[{"q":"How many steps does a playbook have?","a":"Always exactly 8. Each step has an icon, a day offset, points, a name, and message copy, and you cannot add or remove steps. You tune the eight you have."},{"q":"What does the Day field on each step mean?","a":"It is the day offset from when that contact's clock starts. A step set to Day 3 becomes due three days after you start the clock on a contact assigned to that playbook."},{"q":"Can different contacts follow different cadences?","a":"Yes. That is the point of playbooks. Use the Follow-Through Playbook dropdown on each contact to assign the playbook that fits that relationship, so a referral partner and a casual event contact can run on completely different follow-through rhythms."},{"q":"What is the default playbook and how do I change it?","a":"The default is the playbook new contacts use unless you pick a different one. To change it, open any playbook in the editor and turn on Set as Default Playbook. Only one playbook can be the default at a time."},{"q":"What happens to my contacts if I delete a playbook?","a":"Any contact that was assigned to that playbook automatically reverts to your default playbook. You cannot delete the default itself; set another playbook as default first."},{"q":"Do the points on playbook steps count toward my tier?","a":"Yes. Follow-throughs are lead points, the proactive activity you control that predicts future business and moves your weekly tier (Getting Started 0-49, Active Networker 50-99, Consistent Connector 100-149, Professional Networker 150-199, Master Networker 200+). Consistency beats intensity, and follow-through is the easiest activity to skip, so a playbook keeps you honest."},{"q":"Should I build with Lola or start from scratch?","a":"Build with Lola is the fastest start: describe the relationship type and Lola drafts 8 steps you can tweak before saving. Start from scratch gives you a blank grid to name every step and set every cadence and point value yourself. You can always edit a Lola draft, so either path ends in the same editor."},{"q":"Does creating a playbook change any existing contacts?","a":"No. Creating or editing a playbook only changes the contacts already assigned to it. New playbooks do nothing until you assign them on a contact or make one your default."}],"related":["scorecard-coaching-insights","crm-network-contacts","scoring-points-tiers-lead-lag","swh-teams","swh-sign-in-auth"]},{"id":"crm-send-to-mylola","product":"swh","category":"Contacts","title":"Send a SWH contact to MyLola, or save it to your phone","audience":"Pro CRM user","summary":"From any contact's quick actions, push a SWH relationship into your MyLola mortgage CRM (as a contact, partner, prospect, or past client) or save it straight to your Google or Outlook address book.","keywords":["MyLola","send to MyLola","In MyLola","mortgage CRM","Create as","Contact only","Referral Partner","Mortgage Prospect","Realtor Partner","Past Client","Create in MyLola","Include recent SWH notes & activity","Include relationship score & history","Test sync","CRM Integrations","MyLola integration","Save","Save to Contacts","Google Contacts","Outlook Contacts","view in MyLola","re-sync","mylola.ai","save to phone","address book","Connect"],"overview":{"what":"Two separate per-contact quick actions on the SWH contact profile. The MyLola action (lotus icon, labeled MyLola) pushes the relationship into your MyLola mortgage CRM, letting you choose what to create it as and whether to carry over your SWH notes and relationship score. The Save action (address-book icon, labeled Save) opens a Save to Contacts modal that writes the person into your Google Contacts or Outlook Contacts (your phone's address book). MyLola is a separate mortgage CRM, not part of SWH.","why":"Handshakes are the seed, follow through is the harvest. A met contact is only potential until you act on it. Sending a referral partner or borrower into MyLola is the proactive follow-through that turns a logged name into a real pipeline relationship, and dropping someone into your phone's contacts means you can actually reach out. SWH stays your daily relationship tracker (lead points, tiers, FORM conversations); MyLola handles the mortgage pipeline. Connecting them lets you act on a relationship once without re-keying it in two places.","who":"Pro CRM users who work the mortgage side in MyLola, or anyone who wants a SWH contact in their phone's address book. Sending to MyLola requires MyLola to be connected in Settings; saving to Outlook requires Outlook connected in Settings."},"steps":[{"title":"Open the contact and find the quick actions","body":"Tap a person in your contact list to open their profile. The quick-action buttons sit on the profile: Save (address-book icon) and MyLola (lotus icon). The MyLola button reads MyLola if the person has not been sent yet, or In MyLola if they have already been synced."},{"title":"To send to MyLola, tap the MyLola button","body":"Tap the lotus MyLola button. If MyLola is not connected yet, SWH asks Connect to MyLola first? and, if you confirm, opens the MyLola integration settings so you can connect. Once connected, tapping a not-yet-synced contact opens the Send to MyLola modal."},{"title":"Review what will be sent","body":"The Send to MyLola modal shows a read-only summary of Name, Phone, Email, Company, Relationship, Notes, and whether FORM notes will be included. This is the snapshot SWH will hand to MyLola."},{"title":"Pick what to Create as","body":"Under Create as, choose one: Contact only, Referral Partner, Mortgage Prospect, Realtor Partner, or Past Client. This is single-select and tells MyLola whether to create a plain contact or an opportunity-style record (partner, prospect, etc.)."},{"title":"Choose what extra context to carry over","body":"Two checkboxes are on by default: Include recent SWH notes & activity and Include relationship score & history. Leave them checked to bring your follow-through context into MyLola, or uncheck either one to send a leaner record."},{"title":"Create the record in MyLola","body":"Tap Create in MyLola. The button shows Sending while it works, then confirms Sent to MyLola with the new contact id (and an opportunity id when one was created). The button on the profile now reads In MyLola."},{"title":"Later: view or re-sync a synced contact","body":"Tap In MyLola on an already-synced contact. SWH asks whether to type v to view in MyLola (opens that record on mylola.ai in a new tab) or r to re-sync now (pushes your latest SWH data again as an update). Leave it blank to cancel."},{"title":"To save to your phone instead, tap Save","body":"Tap the Save button to open the Save to Contacts modal (titled Save \"Name\" to your contacts). Choose Google Contacts (syncs to Gmail / Android) or Outlook Contacts (syncs to Outlook / iPhone). Google prompts you to grant access the first time; Outlook must be connected in Settings first. SWH writes the name, phone, email, company, and notes, then confirms with a toast like Name saved to Google Contacts."}],"expectedResult":"After Create in MyLola, you see a Sent to MyLola confirmation with a MyLola contact id, the profile button flips to In MyLola, and the record appears in your MyLola mortgage CRM as the type you chose. After saving, you see a toast that the person was saved to Google Contacts or Outlook Contacts, and they appear in that address book on your devices. The contact still lives in SWH unchanged; nothing is moved or deleted.","commonMistakes":["Confusing the two buttons. MyLola (lotus icon) pushes into the mortgage CRM; Save (address-book icon) writes to your phone's Google or Outlook contacts. They go to completely different places.","Tapping MyLola before connecting it. If you have not connected MyLola in Settings, the button just prompts you to connect first instead of opening the send modal.","Trying to save to Outlook Contacts without connecting Outlook. The Outlook option needs Outlook connected in Settings, otherwise you get Connect Outlook in Settings first.","Assuming the send moves the contact out of SWH. It does not. Sending to MyLola or saving to your phone copies the relationship; the SWH contact and your lead points stay put.","Unchecking the include toggles and then wondering why MyLola has no context. If you turn off Include recent SWH notes & activity or Include relationship score & history, that follow-through history does not travel with the record."],"troubleshooting":[{"problem":"Tapping the MyLola button only asks me to connect and never opens the send modal.","causes":["MyLola is not connected yet for your account.","The connection dropped or errored, so SWH no longer sees it as connected."],"fix":"Confirm the Connect to MyLola first? prompt to open the MyLola integration settings, or go to Settings > CRM Integrations > MyLola and tap Connect. Once Status shows Connected, reopen the contact and tap MyLola again. You can use Test sync there to verify the connection is live."},{"problem":"The send fails with Could not send to MyLola, or the contact shows an error state.","causes":["MyLola lost its connection mid-send (the modal needs MyLola connected).","A temporary network or MyLola-side issue.","The contact record could not be read at send time."],"fix":"Open Settings > CRM Integrations > MyLola and check Status and the Last sync error line. Tap Test sync; if it is not connected, tap Connect and try the send again. For an already-synced contact, tap In MyLola and choose r to re-sync now."},{"problem":"Saving to Outlook Contacts does nothing or warns me to connect Outlook.","causes":["Outlook is not connected in Settings.","Outlook is connected but without contact permission, so the sync scope is missing."],"fix":"Go to Settings and connect Outlook. If you connected it a while ago and see a reconnect prompt, reconnect Outlook so it grants contact-sync permission, then reopen the Save modal and choose Outlook Contacts again. Google Contacts works independently and just needs you to approve Google access the first time."},{"problem":"Google says my session expired when I save to Google Contacts.","causes":["The Google access token timed out between sessions."],"fix":"Just tap Google Contacts again. SWH will re-request access; approve it and the save will go through, confirming with Name saved to Google Contacts."}],"faqs":[{"q":"What is MyLola, and is it part of SWH?","a":"MyLola is a separate mortgage CRM that handles pipelines, deal stages, and lender doc flow. SWH stays your daily relationship tracker. Connecting them lets you send a SWH relationship into MyLola one tap at a time instead of re-entering it. They are different products."},{"q":"What is the difference between the MyLola button and the Save button?","a":"The MyLola button (lotus icon) pushes the relationship into your MyLola mortgage CRM. The Save button (address-book icon) opens Save to Contacts and writes the person into your Google Contacts or Outlook Contacts, which is your phone's address book. They send to different destinations."},{"q":"What can I create the contact as in MyLola?","a":"In the Send to MyLola modal under Create as, you can pick Contact only, Referral Partner, Mortgage Prospect, Realtor Partner, or Past Client. It is single-select. Choosing a partner or prospect type tells MyLola to create an opportunity-style record rather than a plain contact."},{"q":"Do my SWH notes and relationship score go to MyLola?","a":"Only if you leave the toggles on. Include recent SWH notes & activity and Include relationship score & history are both checked by default. Uncheck either to send a leaner record. Carrying them over brings your follow-through context into MyLola so the relationship is not starting from scratch."},{"q":"Does sending to MyLola or saving to my phone remove the contact from SWH?","a":"No. Both actions copy the relationship out. The SWH contact stays exactly where it is, and your lead points and tier progress are unaffected. Sending and saving are additive, not a move."},{"q":"Can I update a contact in MyLola after the first send?","a":"Yes. Once a contact is synced, the button reads In MyLola. Tap it and type v to view that record on mylola.ai, or r to re-sync now, which pushes your latest SWH data back to MyLola as an update."},{"q":"Where do I connect or disconnect MyLola?","a":"Go to Settings > CRM Integrations and open the MyLola row. The MyLola integration panel shows Status, your MyLola user ID, and Last sync, with Connect, Test sync, and Disconnect controls. Disconnecting leaves any contacts you already synced inside MyLola untouched."},{"q":"Which devices do Google Contacts and Outlook Contacts sync to?","a":"Google Contacts syncs to Gmail / Android, and Outlook Contacts syncs to Outlook / iPhone, per the Save to Contacts modal. Pick whichever address book your phone uses so the person shows up in your real contacts."}],"related":["crm-network-contacts","scorecard-coaching-insights","scoring-points-tiers-lead-lag","swh-teams","swh-sign-in-auth"]},{"id":"find-your-booking-link","product":"getting-started","category":"Appointments & Booking","title":"Find a host's booking link and sign up for your own","summary":"Learn how MyAppointment booking links are structured, what to do when a link doesn't work, and where to create your own free calendar.","audience":"Borrower / Visitor / Prospect (Loan officer, Realtor, any professional)","keywords":["myappointment.ai","booking link","handle","my link didn't work","link broken","pricing","free calendar","sign up","sign in","how much does it cost","is this a mortgage product"],"overview":{"what":"The MyAppointment landing page explains how booking links are formatted, helps you recover a mistyped link, and points you to sign-up and pricing.","why":"People land here either because they have a host's handle but mistyped the URL, or because they are evaluating MyAppointment for their own scheduling.","who":"Anyone trying to reach a host's calendar, plus prospects (loan officers, realtors, or any professional) considering the product."},"steps":[{"title":"Open a host's booking link","body":"A host's link looks like myappointment.ai/{their-handle} for their hub, or myappointment.ai/{their-handle}/{meeting-type} for a specific booking page. Type or paste the full link into your browser.","screenshot":"/help-screenshots/myappointment/find-your-booking-link/step-1.png","caption":"The MyAppointment URL pattern shown on the landing page."},{"title":"Double-check the spelling if the link fails","body":"If the page doesn't load the host you expected, re-check the handle for typos. If it still won't work, contact the host directly and ask them to resend the link.","screenshot":"/help-screenshots/myappointment/find-your-booking-link/step-2.png","caption":"The URL-pattern recovery block on the landing page."},{"title":"Review the pricing tiers","body":"Click 'See pricing' (or the Pricing link) to jump to the pricing section. Free covers one booking page with up to two meeting types; SWH CRM is $25/mo for unlimited pages across all industries; MyLola CRM is $99/mo for mortgage, adding LoanIQ and Lola.","screenshot":"/help-screenshots/myappointment/find-your-booking-link/step-3.png","caption":"The three-tier pricing section."},{"title":"Get your own free calendar","body":"Click 'Get your free calendar' to start at mylola.ai/sign-up. If you already have an account, click 'Sign in' instead.","screenshot":"/help-screenshots/myappointment/find-your-booking-link/step-4.png","caption":"The 'Get your free calendar' and 'Sign in' buttons."}],"expectedResult":"You either reach the host's hub or booking page, or you successfully start creating your own free calendar at mylola.ai/sign-up.","expectedScreenshot":"/help-screenshots/myappointment/find-your-booking-link/result.png","commonMistakes":["Mistyping the host's handle and assuming the host has no calendar.","Expecting to sign up directly on myappointment.ai; sign-up and sign-in actually happen on mylola.ai.","Assuming MyAppointment is only for mortgage; the booking surface serves all industries."],"troubleshooting":[{"problem":"The host's link didn't work. What should I do?","causes":["Typo in the handle","Host hasn't published their page yet"],"fix":"Re-check the spelling of the handle in the URL. If it still fails, contact the host directly and ask them to resend a working link."},{"problem":"Is this a mortgage-only product?","causes":["Confusion from the MyLola CRM tier mentioning mortgage and Lola"],"fix":"No. The public booking surface serves all industries. Mortgage-specific tooling only lives behind the MyLola CRM tier."}],"faqs":[{"q":"What does the booking link look like?","a":"It's myappointment.ai/{their-handle} for a host's hub, or myappointment.ai/{their-handle}/{meeting-type} for a specific booking page."},{"q":"My link didn't work. What now?","a":"Double-check the spelling of the handle. If you're still stuck, contact the host directly for a fresh link."},{"q":"How much does MyAppointment cost?","a":"Free for one booking page (up to two meeting types). SWH CRM is $25/mo for unlimited pages across all industries. MyLola CRM is $99/mo for mortgage, adding LoanIQ and Lola."},{"q":"Where do I sign up?","a":"Click the 'Get your free calendar' button, which takes you to mylola.ai/sign-up."},{"q":"Is this a mortgage product?","a":"No. The booking surface works for any industry. Mortgage-specific features are part of the MyLola CRM tier only."},{"q":"Do I need an account just to book time with a host?","a":"No. You only need an account to create your own booking pages. Booking time with a host is account-free."}],"related":["host-booking-hub-public","book-a-meeting-public"]},{"id":"host-booking-hub-public","product":"myappointment","category":"Appointments & Booking","title":"Open a host's booking hub and pick a conversation to book","summary":"Browse a host's public hub, read their profile, and choose one of their bookable pages to start scheduling.","audience":"Borrower / Client / Prospect (the person booking)","keywords":["booking hub","host hub","myappointment.ai handle","conversations","being set up","hub isn't public","no conversations available","something went wrong","back to hub","brand color"],"overview":{"what":"A host's hub is their public landing page: photo, name, title/company, optional bio, and a grid or list of bookable pages (called conversations).","why":"It's the surface you reach from a host's email signature, bio link, or text, and it's where you choose what kind of meeting to book.","who":"Anyone booking time with a host. No account or sign-in is required."},"steps":[{"title":"Open the host's hub URL","body":"Go to myappointment.ai/{handle}. The page loads the host's public profile from their published hub.","screenshot":"/help-screenshots/myappointment/host-booking-hub-public/step-1.png","caption":"A loading hub showing 'Loading hub…' while the profile is fetched."},{"title":"Review the host's header","body":"You'll see the host's avatar, name, title or company, optional credentials, and an optional bio. The page chrome stays sky blue; the host's brand color only tints small accents like the card top-border and avatar ring.","screenshot":"/help-screenshots/myappointment/host-booking-hub-public/step-2.png","caption":"The host header with avatar, name, and title."},{"title":"Pick a conversation card","body":"Each card is a bookable page. Click the card for the meeting type you want, and you'll move straight into the booking page in the same flow.","screenshot":"/help-screenshots/myappointment/host-booking-hub-public/step-3.png","caption":"The grid of conversation cards on the hub."}],"expectedResult":"You see the host's profile and a grid of bookable pages, and clicking a card takes you to that page's scheduling wizard.","expectedScreenshot":"/help-screenshots/myappointment/host-booking-hub-public/result.png","commonMistakes":["Mistyping the handle and landing on the 'being set up' shell, then assuming the host has no calendar.","Expecting the host's brand color to recolor the whole page; the chrome stays sky blue by design.","Giving up when a hub looks emp
