<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWH Help</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1a1a1a; --gold:#E63946; --gold-light:#f25862;
    --bg:#EBEBEC; --card:#FFFFFF; --text:#1a1a1a; --text-muted:#6B7280;
    --text-soft:#9AA0A6; --border:#E4E4E7; --radius:16px;
    --green:#5A8A6A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:'DM Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  .disp{font-family:'Playfair Display',Georgia,serif;}
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 72px;}
  a{color:inherit;}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);text-decoration:none;font-size:13px;font-weight:600;border:none;background:none;cursor:pointer;padding:0;font-family:inherit;}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:14px 0 4px;}
  h1.disp{font-size:30px;font-weight:900;margin:0 0 4px;line-height:1.1;}
  .lead{color:var(--text-muted);font-size:14px;line-height:1.6;margin:0 0 18px;}
  .search{width:100%;padding:13px 16px;border-radius:14px;border:1.5px solid var(--border);font-size:15px;font-family:inherit;background:var(--card);outline:none;}
  .search:focus{border-color:var(--gold);}
  .sectlabel{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-soft);margin:22px 0 8px;}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:430px){.cats{grid-template-columns:1fr;}}
  .cat{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 15px;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .12s,transform .12s;}
  .cat:active{transform:scale(.99);}
  .cat .n{display:flex;justify-content:space-between;align-items:baseline;}
  .cat .t{font-size:14.5px;font-weight:700;}
  .cat .c{font-size:12px;color:var(--text-soft);}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;cursor:pointer;font-family:inherit;text-align:left;width:100%;margin-bottom:8px;transition:border-color .12s;}
  .row:hover{border-color:var(--gold-light);}
  .row > span:first-child{min-width:0;}
  .row .t{display:block;font-size:14px;font-weight:700;color:var(--text);}
  .row .s{display:block;font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.45;}
  .row .meta{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-soft);margin-top:6px;}
  .row .arr{color:var(--gold);font-size:18px;font-weight:800;flex-shrink:0;}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--gold);color:#fff;}
  .badge.sub{background:rgba(0,0,0,.06);color:var(--text-muted);}
  .badges{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:12px 0 0;}
  h2.disp{font-size:23px;font-weight:900;margin:10px 0 6px;line-height:1.15;}
  .a-summary{color:var(--text-muted);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .sec{margin-top:20px;}
  .sec h3{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-soft);margin:0 0 10px;}
  .def{display:flex;gap:10px;margin-bottom:8px;}
  .def .k{flex-shrink:0;width:96px;font-size:12px;font-weight:700;color:var(--text-soft);}
  .def .v{font-size:13.5px;line-height:1.6;}
  ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;}
  .step{display:flex;gap:12px;align-items:flex-start;}
  .num{flex-shrink:0;width:25px;height:25px;border-radius:999px;background:var(--gold);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .step .st{font-size:14.5px;font-weight:700;}
  .step .sb{font-size:13.5px;color:var(--text-muted);line-height:1.6;margin-top:3px;}
  ul.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
  ul.bul li{font-size:13.5px;color:var(--text-muted);line-height:1.6;}
  .tcard{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;margin-bottom:10px;}
  .tcard .tp{font-size:13.5px;font-weight:700;}
  .tcard .tl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-soft);margin-top:7px;}
  .tcard .fx{font-size:13px;line-height:1.6;margin-top:8px;}
  .tcard .fx b{font-weight:700;}
  details.faq{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:12px 14px;margin-bottom:9px;}
  details.faq summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;}
  details.faq summary::-webkit-details-marker{display:none;}
  details.faq p{margin:8px 0 0;font-size:13px;color:var(--text-muted);line-height:1.6;}
  .empty{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:18px;color:var(--text-muted);font-size:13.5px;}
  .footer{margin-top:34px;border-top:1px solid var(--border);padding-top:18px;color:var(--text-soft);font-size:12.5px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <button class="back" id="backBtn">&larr; Back to SWH</button>
  <div class="kicker">SWH Help</div>
  <h1 class="disp">How can we help?</h1>
  <p class="lead">Guides for the Scorecard, the Pro CRM, and your booking pages. Search, or browse by topic. <span id="count"></span></p>
  <input class="search" id="q" type="search" placeholder="Search: points, wasted handshakes, FORM, reminders…" aria-label="Search help">
  <div id="view"></div>
  <div class="footer">
    Still stuck? Email <a href="mailto:austen@stopwastinghandshakes.com">austen@stopwastinghandshakes.com</a>.
  </div>
</div>

<script>
const ARTICLES = [{"id":"scoring-points-tiers-lead-lag","product":"swh","category":"Scoring","title":"How points, tiers, and lead vs lag work in SWH","summary":"Learn how every networking action earns points, how weekly points map to tiers, and why lead points (not lag) drive your goal.","audience":"Networker / Loan officer / Realtor","keywords":["points","tiers","lead points","lag points","weekly goal","150 points","Getting Started","Active Networker","Consistent Connector","Professional Networker","Master Networker","activity catalog","Edit Activities & Points","Log What Followed","Receive a Referral","Opportunity Won","scoring engine"],"overview":{"what":"The shared scoring engine that powers both Scorecard and Pro CRM. Every networking action is worth a fixed number of points, points accumulate over a week, and your weekly total maps you to a tier.","why":"It turns networking into a measurable habit. You can see what you proactively did (lead points) versus what results followed (lag points), so you know what is predictive versus what is already in hand.","who":"Anyone using SWH, whether on the Scorecard plan or the Pro CRM plan. The model is identical for both."},"steps":[{"title":"Find your activity catalog","body":"Open Log Activities (CRM) or Home (Scorecard). Each activity has a point value. Defaults range from 1 point for a small 8-step action up to 25 points for hosting an event. Adding a new contact auto-logs 2 points.","screenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/step-1.png","caption":"The default activity list with each activity's point value."},{"title":"Log lead activities to build your score","body":"Tap the plus counter on each proactive activity you performed (attending a meeting, a FORMing conversation, a follow-through, a 1:1, giving a referral). These are lead points and they count toward your weekly goal.","screenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/step-2.png","caption":"Tapping the plus counter on a lead activity raises the running total."},{"title":"Record results as lag points","body":"Open the Results modal (Log What Followed) to record outcomes such as referrals received, opportunities created, and deals won. These are lag points. They are shown alongside your score but do not count toward the weekly goal.","screenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/step-3.png","caption":"The Log What Followed modal where lag outcomes are entered."},{"title":"Save the day","body":"Tap Save (Scorecard) or Save Today (CRM). Counts are not auto-saved on every tap, so this step is what writes your day and recomputes your weekly total and tier badge.","screenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/step-4.png","caption":"The Save button persists the day's logged activities."},{"title":"Customize activities and goal if you want","body":"Go to Settings to change point values (Edit Activities & Points), your weekly goal (default 150), and the day your week starts on (default Monday). Edits to point values apply only to new logs, not past history.","screenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/step-5.png","caption":"Settings showing the weekly goal and Edit Activities & Points options."}],"expectedResult":"After saving, your weekly lead total recomputes and your tier badge updates: Getting Started (0-49), Active Networker (50-99), Consistent Connector (100-149), Professional Networker (150-199), or Master Networker (200+). The goal bar reflects lead points only.","expectedScreenshot":"/help-screenshots/swh/scoring-points-tiers-lead-lag/result.png","commonMistakes":["Forgetting to tap Save after counting activities. Counts are not auto-persisted on every tap.","Expecting Receive a Referral or Opportunity Won to raise your tier. Those are lag points and do not count toward the weekly lead goal.","Assuming that editing point values rewrites past history. It does not. Edits apply to new logs only."],"troubleshooting":[{"problem":"Why didn't my points save?","causes":["You tapped the plus counter but never tapped Save","On native iOS the save call failed because of a network issue"],"fix":"Re-count your activities and tap Save. If you are on iOS and it keeps failing, check your connection and try again, since native saves route through the saveDay Cloud Function."},{"problem":"Why is my tier stuck even though I have been logging a lot?","causes":["The activity you logged was a lag result rather than a lead activity"],"fix":"Tiers track lead points only. Log proactive lead activities (meetings, conversations, follow-throughs, 1:1s) to move your tier."},{"problem":"Why did my weekly total reset?","causes":["Your configured week-start day rolled over to a new week"],"fix":"This is expected. Weekly totals reset each week. Your lifetime totals are kept in History. You can change the week-start day in Settings."}],"faqs":[{"q":"How many points is each activity worth?","a":"Defaults range from 1 point for a small 8-step action to 25 for hosting an event. Adding a contact is 2, conversations and follow-throughs are 5, 1:1s and referrals given are 10, an opportunity won is 15. All values are fully customizable in Settings."},{"q":"What is the difference between lead and lag points?","a":"Lead points come from proactive activity that predicts future results. Lag points are results that already happened (a referral received, a deal won). Only lead points count toward your weekly goal."},{"q":"How do I change my weekly goal?","a":"Go to Settings and set Weekly Point Goal. The default is 150 points per week."},{"q":"Can I edit the activities and their point values?","a":"Yes. Go to Settings and choose Edit Activities & Points. Changes apply to new logs only, not to past history."},{"q":"What day does my week start on?","a":"Monday by default. You can change it in Settings under Week Starts On."},{"q":"Do points expire?","a":"Weekly totals reset each week, but your lifetime totals are kept in History so nothing is lost."},{"q":"Which tier do I need for the weekly goal?","a":"The default 150-point goal lines up with the Professional Networker tier (150-199 lead points per week)."}],"related":["scorecard-home-daily-log","crm-log-activities","scorecard-scoreboard-stats","crm-history-reporting"]},{"id":"scorecard-home-daily-log","product":"swh","category":"Scoring","title":"Log today's networking activities on the Scorecard Home screen","summary":"Use the Scorecard Home screen to count today's networking activities, watch your weekly pace, and save your day.","audience":"Networker","keywords":["Scorecard","Home","daily log","Save","Log What Followed","weekly pace","vs Avg","tier badge","CRM","$10 plan","log activity"],"overview":{"what":"The Scorecard app's main screen, where you log today's networking activities and see your day and week status at a glance.","why":"It is the fastest way to capture what you did each day and keep your networking habit on track.","who":"Networkers on the $10/mo Scorecard plan, including users who only have the scorecard plan inside the app."},"steps":[{"title":"Open Home","body":"Land on the Home screen. The day card shows Today's Log with your Points, Activities count, and how today compares to your average (vs Avg).","screenshot":"/help-screenshots/swh/scorecard-home-daily-log/step-1.png","caption":"The Home screen day card with Points, Activities, and vs Avg."},{"title":"Count each activity","body":"Tap the plus counter on each activity you completed today. The running point total updates live as you tap.","screenshot":"/help-screenshots/swh/scorecard-home-daily-log/step-2.png","caption":"Tapping plus on activities in the Log Activities list."},{"title":"Watch your pace and tier","body":"As you log, the Weekly Pace line and your tier badge update to show where you stand for the week.","screenshot":"/help-screenshots/swh/scorecard-home-daily-log/step-3.png","caption":"Weekly Pace line and tier badge updating live."},{"title":"Save your day","body":"Tap Save in the floating save bar at the bottom. The save bar stays hidden until your points are above zero, so make sure you have counted at least one activity.","screenshot":"/help-screenshots/swh/scorecard-home-daily-log/step-4.png","caption":"The floating Save bar at the bottom of the screen."},{"title":"Optionally log what followed","body":"Tap Log What Followed to record lag results like a referral you received or a deal you won. These show alongside your score but do not move the weekly goal bar.","screenshot":"/help-screenshots/swh/scorecard-home-daily-log/step-5.png","caption":"The Log What Followed button on Home."}],"expectedResult":"You see a save confirmation, your weekly pace and tier badge update, and the saved day appears in your History.","expectedScreenshot":"/help-screenshots/swh/scorecard-home-daily-log/result.png","commonMistakes":["Logging a results-type item (a referral received or a deal won) and expecting it to move the weekly goal bar. Those are lag points.","Not noticing that the floating save bar is at the bottom. Your counts will not persist until you tap it."],"troubleshooting":[{"problem":"Why does the Save button do nothing?","causes":["You have not counted any activities yet, so saving is disabled at 0 points"],"fix":"Tap plus on at least one activity. The save bar appears once your points are above zero."},{"problem":"Why does my name show Loading?","causes":["Your profile fetch (getMe) is still in flight or failed"],"fix":"Wait a moment for the profile to load. If it stays stuck, refresh the app or check your connection."}],"faqs":[{"q":"Where do I log my daily activity?","a":"On the Home screen. Tap the plus counter on each activity you completed."},{"q":"What does vs Avg mean?","a":"It compares today's points to your running daily average so you can see if today was above or below your norm."},{"q":"How do I log a referral I received or a deal I won?","a":"Use the Log What Followed button to enter those lag results."},{"q":"Can I edit a previous day?","a":"Yes. Open the day from History. An Editing past day banner appears while you make changes."},{"q":"How do I open the full CRM from Scorecard?","a":"Tap the CRM button. It only appears if you have CRM access."},{"q":"Why do I have to tap Save every time?","a":"Counts are not auto-saved on every tap, so tapping Save is what writes the day and updates your week."}],"related":["scoring-points-tiers-lead-lag","scorecard-scoreboard-stats","scorecard-onboarding-sms-reminder","crm-log-activities"]},{"id":"scorecard-scoreboard-stats","product":"swh","category":"Reporting","title":"Review your networking stats on the Scorecard Scoreboard","summary":"Use the Scoreboard to see your points by range, your tier and goal progress, daily trends, activity mix, and the results that followed.","audience":"Networker","keywords":["Scoreboard","stats","analytics","This Week","This Month","6 Months","12 Months","Lifetime","Daily Points Trend","Activity Mix","growth activities","Results","What Followed","lag results"],"overview":{"what":"Your personal analytics and reporting view, showing weekly through lifetime points, your tier and goal cards, a daily trend chart, your activity mix, growth activities, and the results that followed your networking.","why":"It helps you spot trends, confirm you are hitting your goal, and see which of your activities are actually turning into deals and referrals.","who":"Networkers who want to review their performance over time."},"steps":[{"title":"Open Scoreboard","body":"Tap Scoreboard from the bottom navigation.","screenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/step-1.png","caption":"The Scoreboard tab in the bottom navigation."},{"title":"Pick a time range","body":"Use the range toggle to switch between This Week, This Month, 6 Months, 12 Months, and Lifetime.","screenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/step-2.png","caption":"The five-option range toggle."},{"title":"Read your stats, tier, and goal","body":"Review the stats grid, your tier card, and your goal progress percentage for the selected range.","screenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/step-3.png","caption":"Stats grid, tier card, and goal progress."},{"title":"Scan trends and activity mix","body":"Look at the Daily Points Trend chart and the Activity Mix, which breaks your points down by category.","screenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/step-4.png","caption":"Daily Points Trend chart and Activity Mix breakdown."},{"title":"Check the results that followed","body":"Review the Results (What Followed) grid for lag outcomes. Tap plus Log to add more.","screenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/step-5.png","caption":"The Results (What Followed) grid with the plus Log button."}],"expectedResult":"You see populated bars, your current tier, your goal percentage, and a category breakdown for the range you chose, plus any lag results in the What Followed grid.","expectedScreenshot":"/help-screenshots/swh/scorecard-scoreboard-stats/result.png","commonMistakes":["Reading the Results panel as lead activity. It is the lag (outcomes) panel, not your proactive activity.","Expecting a full 12-month chart on a brand new account. The longer ranges will look sparse until you build history."],"troubleshooting":[{"problem":"Why is my chart empty?","causes":["No days have been saved yet in the selected range"],"fix":"Save at least one day, or switch to a shorter range that includes days you have logged."},{"problem":"Why does my 12-month view look so sparse?","causes":["Your account is new and does not have a year of history yet"],"fix":"This is expected for new accounts. The view fills in as you keep logging over time."}],"faqs":[{"q":"How do I see my lifetime points?","a":"Open Scoreboard and switch the range toggle to Lifetime."},{"q":"What is the Activity Mix?","a":"A breakdown of your points by category, so you can see where most of your networking effort goes."},{"q":"What are growth activities?","a":"A tagged subset of activities (such as speaking, content, and deeper conversations) surfaced separately to encourage range in your networking."},{"q":"Where do I see deals or referrals that resulted from my networking?","a":"In the Results (What Followed) grid on the Scoreboard."},{"q":"Does this match the CRM History screen?","a":"Yes, it uses the same scoring engine. The CRM History screen is the richer version of the same data."},{"q":"Can I add a lag result from here?","a":"Yes. In the Results section, tap plus Log to open the lag modal."}],"related":["scoring-points-tiers-lead-lag","scorecard-home-daily-log","crm-history-reporting"]},{"id":"scorecard-onboarding-sms-reminder","product":"swh","category":"Getting started","title":"Turn on daily SMS reminders during Scorecard onboarding","summary":"Add your mobile number during onboarding so SWH can text you when you have not logged your day.","audience":"Networker","keywords":["onboarding","SMS reminder","text reminder","daily reminder","phone number","+1","opt in","skip","STOP","saveOnboardingPhone"],"overview":{"what":"A one-time step after signup that captures your mobile number for an optional daily reminder text when you have not logged your activity.","why":"A gentle nudge helps you keep the daily logging habit so your weekly score stays on track.","who":"New networkers signing in for the first time without a phone number on file."},"steps":[{"title":"Reach the onboarding screen","body":"After your first sign-in with no phone on file, the onboarding screen appears automatically.","screenshot":"/help-screenshots/swh/scorecard-onboarding-sms-reminder/step-1.png","caption":"The onboarding SMS opt-in screen."},{"title":"Enter your mobile number","body":"Type your 10-digit US mobile number. The app prepends +1 for you, so do not add a country code, and the field caps at 10 digits.","screenshot":"/help-screenshots/swh/scorecard-onboarding-sms-reminder/step-2.png","caption":"The 10-digit mobile number input with a fixed +1 prefix."},{"title":"Opt in or skip","body":"Tap Yes, Remind Me Daily to turn on reminders, or tap Skip for now to continue without them. Either choice takes you to Home.","screenshot":"/help-screenshots/swh/scorecard-onboarding-sms-reminder/step-3.png","caption":"The Yes, Remind Me Daily and Skip for now buttons."}],"expectedResult":"You land on the Home screen. If you opted in, you will get a reminder text (around 5 PM) only on days you have not logged any activity.","expectedScreenshot":"/help-screenshots/swh/scorecard-onboarding-sms-reminder/result.png","commonMistakes":["Typing a country code or formatting characters. The UI already prepends +1 and caps the field at 10 digits.","Assuming you can never add your number after skipping. You can add it later in Settings."],"troubleshooting":[{"problem":"Why has my reminder never arrived?","causes":["You opted out","The scheduled reminder did not match your timezone window","You already logged that day, so no reminder is sent"],"fix":"Confirm reminders are enabled in Settings and that your number is correct. The reminder only fires on days you have not logged any activity."},{"problem":"How do I stop getting reminder texts?","causes":["You want to opt out of daily reminders"],"fix":"Reply STOP to a reminder text, or turn reminders off in Settings."}],"faqs":[{"q":"Will I get spammed with texts?","a":"No. The text only fires on a day when you have not logged any activity."},{"q":"Can I add my number later?","a":"Yes. You can add or update it any time in Settings."},{"q":"Is an international number supported?","a":"The onboarding UI is US +1 only."},{"q":"How do I stop reminders?","a":"Reply STOP to a reminder text, or turn the reminder off in Settings."},{"q":"What time does the reminder fire?","a":"Around 5 PM if your day is still unlogged. It is server-scheduled to your timezone window."}],"related":["scorecard-home-daily-log","crm-settings","swh-sign-in-auth"]},{"id":"crm-dashboard","product":"swh","category":"Reporting","title":"Run your morning check-in on the Pro CRM Dashboard","summary":"Use the CRM Dashboard to see this week's KPIs, coaching nudges, wasted-handshake alerts, your next meeting, and event ROI at a glance.","audience":"Loan officer / Realtor / Networker","keywords":["dashboard","CRM home","KPI","This Week's Points","Weekly Goal","Active Contacts","Avg Points/Day","coaching","wasted handshakes","next meeting","event ROI","beta","export coming soon","Week in Review"],"overview":{"what":"The Pro CRM home screen, a command center combining this-week KPIs, today's activity, activity mix, your current tier, the lead-vs-lag split, coaching nudges, wasted-handshake alerts, your next meeting, and event ROI.","why":"It gives you one place to start your day and decide what to act on, especially the relationships that have gone stale.","who":"Sales users and networkers on the $25/mo Pro plan."},"steps":[{"title":"Open the CRM","body":"The Dashboard is the default screen when you open the Pro CRM.","screenshot":"/help-screenshots/swh/crm-dashboard/step-1.png","caption":"The CRM Dashboard as the default landing screen."},{"title":"Read your KPI tiles","body":"Review the four KPI tiles: This Week's Points, Weekly Goal, Active Contacts, and Avg Points/Day, plus the Week in Review hero.","screenshot":"/help-screenshots/swh/crm-dashboard/step-2.png","caption":"The four KPI tiles and the Week in Review hero."},{"title":"Review coaching and wasted handshakes","body":"Read the Coaching card for contextual nudges and the Wasted Handshakes card, which lists your top 3 flagged contacts plus a more link.","screenshot":"/help-screenshots/swh/crm-dashboard/step-3.png","caption":"The Coaching card and the Wasted Handshakes alert card."},{"title":"Act on what you see","body":"Tap a wasted contact to jump straight to their profile, tap View All to open the Pipeline or Network, or tap the Next Meeting card to open Appointments. Tap plus Log Today to start logging.","screenshot":"/help-screenshots/swh/crm-dashboard/step-4.png","caption":"Jumping from a dashboard card into a contact or the Log screen."}],"expectedResult":"You have a clear picture of your week: your KPIs are filled in, you know which contacts need attention, and you can jump directly to the right screen to act.","expectedScreenshot":"/help-screenshots/swh/crm-dashboard/result.png","commonMistakes":["Treating Active Contacts as a quality metric. It is just a raw count of all your contacts.","Ignoring the Wasted Handshakes card. Addressing stale relationships is the whole point of the product."],"troubleshooting":[{"problem":"Why are my KPIs stuck showing a dash?","causes":["Your day history or contacts have not finished loading yet"],"fix":"Give the screen a moment to load. If the dashes persist, refresh the app or check your connection."},{"problem":"Why is there no Next Meeting card?","causes":["You have no MyAppointment booking integration data","You have no upcoming scheduled meeting"],"fix":"Set up MyAppointment.AI booking on mylola.ai and make sure you have an upcoming meeting. The card appears once booking data loads."}],"faqs":[{"q":"What do the four top tiles mean?","a":"This week's points, your weekly goal, your active contact count, and your average points per day."},{"q":"What is a wasted handshake?","a":"A contact you invested in but let go stale. See the Wasted Handshakes article for how flagging works."},{"q":"Why is the Export button not working?","a":"Export is not yet implemented. It shows a coming soon toast for now."},{"q":"Where does Next Meeting come from?","a":"From your MyAppointment.AI booking integration."},{"q":"What is Event ROI?","a":"Revenue versus cost per networking event. Tap View All to see the full breakdown in the Pipeline."},{"q":"Why is there a Beta pill?","a":"The CRM is in open beta."}],"related":["crm-wasted-handshakes","crm-network-contacts","crm-pipeline-opportunities","crm-appointments","scoring-points-tiers-lead-lag"]},{"id":"crm-network-contacts","product":"swh","category":"Contacts","title":"Add, find, and grade contacts in My Network","summary":"Use the My Network screen to search and filter your contacts, add them manually or by scanning a business card, and set each one's partner grade.","audience":"Loan officer / Realtor / Networker","keywords":["My Network","contacts","add contact","scan card","business card scanner","partner grade","A+ Partner","A Partner","B Partner","D","New","Wasted","FORM","8 Steps","duplicate phone","Where Did You Meet","Extract Info","status"],"overview":{"what":"Your contact list and relationship hub. Search, filter by partner grade, add contacts manually or by scanning a business card, and drill into each contact's profile, FORM notes, 8-step progress, activity timeline, opportunities, and emails.","why":"It keeps every relationship in one place so you can see who matters most and follow up before contacts go stale.","who":"Sales users and networkers on the Pro CRM plan."},"steps":[{"title":"Search and filter your network","body":"Use Search to find a contact by name, company, or event. Use the filter chips to narrow by grade: All, A+ Partner, A Partner, B Partner, D, New, or Wasted.","screenshot":"/help-screenshots/swh/crm-network-contacts/step-1.png","caption":"The search box and grade filter chips above the contact list."},{"title":"Add a contact manually","body":"Tap plus Add Contact. Fill in First Name and Last Name (required), plus Phone, Email, Company, Where Did You Meet, Status, Follow-Through Playbook, and First Notes. Optionally check Start 8-step follow-through campaign today, then tap Add Contact.","screenshot":"/help-screenshots/swh/crm-network-contacts/step-2.png","caption":"The Add Contact modal with name fields and the Start campaign checkbox."},{"title":"Or scan a business card","body":"Tap Scan Card, take a photo or upload an image, then tap Extract Info. The AI scanner returns the first name, last name, phone, email, company, and title. Review the pre-filled fields, add Where Did You Meet, and confirm Add Contact.","screenshot":"/help-screenshots/swh/crm-network-contacts/step-3.png","caption":"The business card scanner with the Extract Info button."},{"title":"Set the partner grade","body":"Choose a Status to grade the relationship: New, A+ Partner, A Partner, B Partner, or D. You can change it later as the relationship matures.","screenshot":"/help-screenshots/swh/crm-network-contacts/step-4.png","caption":"The Status dropdown with the five partner grades."},{"title":"Open a contact to work it","body":"Tap a contact to expand it. Use the quick actions (Call, Text, Email, Add Opp, Save to phone, Book, MyLola) and tab through Profile, Activity, FORM, 8 Steps, Opps, and Emails.","screenshot":"/help-screenshots/swh/crm-network-contacts/step-5.png","caption":"An expanded contact card with quick actions and tabs."}],"expectedResult":"Your new contact appears in the list. Adding one auto-logs the Add New Contact activity for 2 points. Wasted contacts show with a red left-border card and the warning Wasted handshake, address this week.","expectedScreenshot":"/help-screenshots/swh/crm-network-contacts/result.png","commonMistakes":["Skipping the Start campaign checkbox and then wondering why the 8-step clock never started.","Assuming phone is mandatory. The red asterisk implies it, but only first and last name are actually enforced.","Adding the same person twice with a differently formatted phone. Normalization usually catches duplicates, but only on phone, not on name or email."],"troubleshooting":[{"problem":"Why did my card scan fail?","causes":["The image is unreadable","No image was attached","The AI returned a response the app could not read"],"fix":"Retake the photo with good lighting and a clear, flat card, then tap Extract Info again. You can always fill the fields in manually."},{"problem":"Why do I see already has this phone number?","causes":["A contact with the same normalized phone number already exists"],"fix":"Search for that person first. If they are already in your network, edit the existing record instead of adding a duplicate."},{"problem":"Why won't my contact save?","causes":["First name or last name is blank"],"fix":"Fill in both the first and last name fields, which are required, then save again."}],"faqs":[{"q":"How do I add a contact?","a":"Tap plus Add Contact to enter details manually, or tap Scan Card to capture a business card."},{"q":"What do A+, A, B, and D mean?","a":"They are partner grades from top to low value (A+ Partner, A Partner, B Partner, and D). You set them yourself."},{"q":"What is FORM?","a":"Family, Occupation, Recreation, and Motivation. It is the conversation framework for getting to know someone, captured on each contact's FORM tab."},{"q":"How does duplicate detection work?","a":"By normalized phone number when you save. If the same phone already exists, the save is blocked with a toast."},{"q":"What does Start 8-step campaign do?","a":"It starts the follow-through clock and, if enabled, schedules the steps to your Google Calendar."},{"q":"Can the app read a business card?","a":"Yes. The AI extracts the fields for you, and you review them before saving."},{"q":"How do I find stale contacts?","a":"Use the Wasted filter chip. It shows contacts that have been flagged as wasted handshakes."}],"related":["crm-contact-profile-form-8-steps","crm-wasted-handshakes","crm-pipeline-opportunities","crm-settings","crm-dashboard"]},{"id":"crm-contact-profile-form-8-steps","product":"swh","category":"Contacts","title":"Work a relationship with FORM notes and the 8-step follow-through system","summary":"Capture FORM notes, start the 8-step follow-through clock, and put the steps on your calendar to turn a handshake into a referral partner.","audience":"Loan officer / Realtor / Networker","keywords":["FORM","Family Occupation Recreation Motivation","8 steps","follow-through","Start Clock","playbook","Good to Meet You","Value Touch","Invite to 1:1","FORM Conversation","Google Calendar sync","ICS","Apple","Outlook","late step","clockStarted","Log Activity","Note type"],"overview":{"what":"The relationship-tracking core. Each contact carries a FORM profile, an activity timeline, and an 8-step follow-through clock driven by a Playbook that schedules touches from Day 1 to Day 45.","why":"Consistent, well-timed follow-through is what turns a single handshake into a lasting referral partner instead of a stale contact.","who":"Sales users and networkers who want to systematically nurture their relationships."},"steps":[{"title":"Open the 8 Steps tab and start the clock","body":"Expand a contact and open the 8 Steps tab. Tap Start Clock to begin the follow-through schedule (or check the box when you first add the contact). The clock only runs once it is started.","screenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/step-1.png","caption":"The 8 Steps tab with the Start Clock button."},{"title":"Put the steps on your calendar","body":"Tap Run Sync to add the steps to Google Calendar, or tap Apple/Outlook to download an ICS file. Use Stop Sync to turn Google Calendar sync off.","screenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/step-2.png","caption":"Calendar sync and ICS download buttons on the 8 Steps tab."},{"title":"Complete and log each step","body":"As you finish each step (Good to Meet You on Day 1, Social Connection on Day 3, Value Touch on Day 6, and so on through Long-Term Positioning on Day 45), log it. The step marks done and contributes points. Steps you have not done past their due date are flagged late.","screenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/step-3.png","caption":"The 8-step schedule with completed and overdue steps."},{"title":"Capture FORM notes","body":"Open the FORM tab and fill in Family, Occupation, Recreation, Motivation, and Notes. These textareas auto-save when you tap out of the field (on blur).","screenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/step-4.png","caption":"The FORM tab with Family, Occupation, Recreation, and Motivation fields."},{"title":"Log interactions on the Activity tab","body":"Use plus Log Activity to record an interaction. Pick an Activity Type and add an optional note. Most types add points to your daily Scorecard, while the Note type is a zero-point journal entry.","screenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/step-5.png","caption":"The Log Activity entry with Activity Type and Note."}],"expectedResult":"The contact shows Clock started with a date, the steps appear on your calendar if synced, completed steps are marked done and scored, and your FORM notes are saved. Logging an interaction also clears any wasted flag.","expectedScreenshot":"/help-screenshots/swh/crm-contact-profile-form-8-steps/result.png","commonMistakes":["Never starting the clock, so steps never come due and the contact eventually flags as wasted.","Pitching on step 1. The system explicitly tells you to send a quick, no-pitch hello early on.","Assuming FORM notes sync to a mortgage CRM automatically. That requires the MyLola integration."],"troubleshooting":[{"problem":"Why do my steps never come due?","causes":["The clock has not been started for that contact"],"fix":"Open the 8 Steps tab and tap Start Clock. The schedule only runs from the moment the clock starts."},{"problem":"Why didn't the calendar events appear?","causes":["Google Calendar is not connected","Auto-add is disabled in Settings"],"fix":"Connect Google Calendar and enable the Auto-add 8-Step to Google Calendar toggle in Settings, then run sync again. You can also download the ICS file for Apple or Outlook."},{"problem":"Why is this contact on a different cadence than I expected?","causes":["The contact is assigned to a different Playbook"],"fix":"Check which Playbook the contact is using. You can manage Playbooks in Settings under Follow-Through Playbooks and reassign the contact."}],"faqs":[{"q":"What are the 8 steps?","a":"A Day 1 through Day 45 follow-through cadence: Good to Meet You, Social Connection, Value Touch, Invite to 1:1, FORM Conversation, Strategic Follow Through, Stay Top of Mind, and Long-Term Positioning."},{"q":"How do I start the follow-through clock?","a":"Open the 8 Steps tab and tap Start Clock, or check the box when you add the contact."},{"q":"Can I put the steps on my calendar?","a":"Yes. Use Google Calendar sync, or download an ICS file for Apple or Outlook."},{"q":"Can I have different follow-up sequences for different people?","a":"Yes. You can create multiple Playbooks and assign one per contact. Each Playbook always has exactly 8 steps."},{"q":"What is FORM and where do I record it?","a":"Family, Occupation, Recreation, and Motivation. You record it on the contact's FORM tab, and it auto-saves when you tap out of a field."},{"q":"Does logging a contact activity also score points?","a":"Yes, unless you pick the Note type, which is a zero-point journal entry."}],"related":["crm-network-contacts","crm-wasted-handshakes","crm-todays-tasks","crm-settings"]},{"id":"crm-todays-tasks","product":"swh","category":"Scheduling","title":"Clear your day with the Today's Tasks screen","summary":"Work a prioritized daily list of overdue and due-today follow-up steps, wasted handshakes, and your daily-log and weekly-goal tasks.","audience":"Loan officer / Realtor / Networker","keywords":["Today's Tasks","overdue","due today","wasted handshakes","clock never started","A+ Partners","Edit Thresholds","daily log task","weekly goal task","all caught up"],"overview":{"what":"Your daily action list. It surfaces overdue 8-step actions, steps due today, wasted handshakes, contacts whose clock never started, your daily-log task, and your weekly-goal task.","why":"It tells you exactly what to do today so no relationship slips through the cracks.","who":"Sales users and networkers who want a clear, prioritized to-do list each day."},"steps":[{"title":"Open Today's Tasks","body":"Open the Today's Tasks screen. The summary tiles at the top show counts for Overdue, Today, Wasted, and A+ Partners.","screenshot":"/help-screenshots/swh/crm-todays-tasks/step-1.png","caption":"The Today's Tasks summary tiles."},{"title":"Work top-down by priority","body":"Start with Wasted Handshakes, then handle overdue steps, then steps due today. Tap each task to jump to the relevant contact.","screenshot":"/help-screenshots/swh/crm-todays-tasks/step-2.png","caption":"The prioritized task groups with counts."},{"title":"Use the tiles to navigate","body":"Tap the A+ Partners tile to jump straight to your A+ partners in the filtered Network. Tap a task to open the right contact or the Log screen.","screenshot":"/help-screenshots/swh/crm-todays-tasks/step-3.png","caption":"Tapping the A+ Partners tile to open the filtered Network."},{"title":"Finish your daily and weekly tasks","body":"Complete the Log Today's Activities task and the Weekly Goal task to close out your day.","screenshot":"/help-screenshots/swh/crm-todays-tasks/step-4.png","caption":"The daily-log and weekly-goal tasks at the bottom of the list."}],"expectedResult":"When you have handled everything, the screen shows All caught up, no overdue steps or wasted handshakes.","expectedScreenshot":"/help-screenshots/swh/crm-todays-tasks/result.png","commonMistakes":["Ignoring clock never started contacts. They become wasted handshakes if left alone.","Expecting the Edit Thresholds button to work. The threshold editor is coming soon and not yet available."],"troubleshooting":[{"problem":"Why are some wasted thresholds shown but not all enforced?","causes":["Only two of the four listed thresholds actually flag contacts right now"],"fix":"Currently only clock-never-started and no-touch-in-21-days flag contacts. The stuck-same-step and opportunity-stalled thresholds are displayed but not yet wired up."},{"problem":"Why does the task count badge look wrong?","causes":["Your contacts or day history are still loading"],"fix":"Give the screen a moment. The counts show a dash while data loads and then fill in."}],"faqs":[{"q":"What shows up as a task?","a":"Overdue and due 8-step actions, wasted handshakes, your daily log, and your weekly goal."},{"q":"What does Overdue mean?","a":"An 8-step action that is past its due date."},{"q":"Can I change the wasted thresholds?","a":"Not yet. The threshold editor is coming soon."},{"q":"Why is a contact in Wasted?","a":"Either the clock was never started within the window, or there has been no touch in 21 days."},{"q":"How do I get to my A+ partners fast?","a":"Tap the A+ Partners tile to open the filtered Network."}],"related":["crm-wasted-handshakes","crm-contact-profile-form-8-steps","crm-network-contacts","crm-log-activities"]},{"id":"crm-wasted-handshakes","product":"swh","category":"Contacts","title":"Find and fix wasted handshakes","summary":"Understand how SWH flags relationships you let go stale and clear the flag by logging an interaction.","audience":"Loan officer / Realtor / Networker","keywords":["wasted handshakes","stale contacts","detectWastedHandshakes","clock never started","no contact touch","48 hours","21 days","un-waste","flagged contact","needs attention"],"overview":{"what":"The product's namesake feature. It automatically flags relationships you invested in but let go stale so you can address them before they expire.","why":"Most networking value is lost in the follow-up. Catching stale relationships early is the entire thesis of SWH.","who":"Sales users and networkers who want to protect the relationships they have already built."},"steps":[{"title":"Spot flagged contacts","body":"Look at the Wasted Handshakes card on the Dashboard (top 3) or the Today's Tasks screen, or use the Wasted filter chip on the Network screen.","screenshot":"/help-screenshots/swh/crm-wasted-handshakes/step-1.png","caption":"The Wasted Handshakes alert card listing flagged contacts."},{"title":"Open a flagged contact","body":"Tap a flagged contact to open their profile, which shows the red wasted banner reading Wasted handshake, address this week.","screenshot":"/help-screenshots/swh/crm-wasted-handshakes/step-2.png","caption":"A contact profile with the red wasted banner."},{"title":"Log an interaction to un-waste them","body":"Log any interaction (call, text, email, or note). Logging an activity clears the wasted flag and restarts the follow-through clock.","screenshot":"/help-screenshots/swh/crm-wasted-handshakes/step-3.png","caption":"Logging an activity that clears the wasted flag."}],"expectedResult":"The contact is no longer flagged. When you have none left, the card reads No wasted handshakes, great work.","expectedScreenshot":"/help-screenshots/swh/crm-wasted-handshakes/result.png","commonMistakes":["Adding lots of contacts but never starting their clocks. They flag after 48 hours with zero logged steps.","Assuming the stuck-same-step (14 days) and opportunity-stalled (30 days) thresholds fire. They are advertised but not yet wired up."],"troubleshooting":[{"problem":"Why does a contact I just touched still show as wasted?","causes":["The wasted flag recomputes when the screen loads, so the view may not have refreshed yet"],"fix":"Navigate away and back, or refresh, so the flag re-renders after your activity."},{"problem":"Why didn't a contact I expected to flag get flagged?","causes":["Only clock-never-started and no-touch-in-21-days are actually enforced"],"fix":"Confirm the contact meets one of those two conditions. The other advertised thresholds do not currently flag anyone."}],"faqs":[{"q":"What is a wasted handshake?","a":"A networking investment you let go stale, a contact you connected with but never followed up on."},{"q":"When does a contact get flagged?","a":"When there are no logged steps 48 hours after you added them, or when there has been no touch in 21 days."},{"q":"How do I un-waste a contact?","a":"Log any activity with them. That clears the flag and restarts the clock."},{"q":"Can I customize the thresholds?","a":"Not yet in the UI. The threshold editor is coming soon."},{"q":"Do all the listed thresholds actually work?","a":"Not currently. Only clock-never-started and no-touch-in-21-days flag contacts today."}],"related":["crm-network-contacts","crm-contact-profile-form-8-steps","crm-todays-tasks","crm-dashboard"]},{"id":"crm-log-activities","product":"swh","category":"Scoring","title":"Log and save your day on the CRM Log Activities screen","summary":"Count your daily activities with context prompts, watch your weekly summary, and edit past days from the CRM Log screen.","audience":"Loan officer / Realtor / Networker","keywords":["Log Activities","Save Today","Add Activity Manually","context popup","editing past day","weekly goal","needed today","tier","deal value","method chips","takeaway"],"overview":{"what":"The CRM-side daily logger. It uses the same scoring engine as Scorecard Home, adds a desktop summary sidebar, lets you edit past days, and shows context prompts for richer activities.","why":"It captures more detail than the lightweight Scorecard, so your records carry who, where, and how for each activity.","who":"Sales users and networkers on the Pro CRM plan."},"steps":[{"title":"Open Log Activities","body":"Open the Log Activities screen in the CRM.","screenshot":"/help-screenshots/swh/crm-log-activities/step-1.png","caption":"The CRM Log Activities screen."},{"title":"Count each activity and fill any context","body":"Tap the plus and minus counters per activity. Some activities open a context popup where you can add the event, contact, method, takeaway, or deal value.","screenshot":"/help-screenshots/swh/crm-log-activities/step-2.png","caption":"A context popup prompting for event, contact, and method."},{"title":"Add a one-off activity if needed","body":"Tap Add Activity Manually to log a custom activity that is not in your standard list.","screenshot":"/help-screenshots/swh/crm-log-activities/step-3.png","caption":"The Add Activity Manually modal."},{"title":"Watch your summary","body":"On desktop, the summary sidebar shows points today, your week total, your weekly goal, how many points you still need today, and your tier.","screenshot":"/help-screenshots/swh/crm-log-activities/step-4.png","caption":"The desktop summary sidebar with today, week, goal, and tier."},{"title":"Save Today","body":"Tap Save Today (the desktop button or the mobile floating bar). Saving is disabled until you have logged points. If you are editing a past day, a red banner shows the date with a Cancel option.","screenshot":"/help-screenshots/swh/crm-log-activities/step-5.png","caption":"The Save Today button and the editing-past-day banner."}],"expectedResult":"You see a save confirmation and your week total updates. Any edited past day recomputes and changes your weekly total accordingly.","expectedScreenshot":"/help-screenshots/swh/crm-log-activities/result.png","commonMistakes":["Editing a past day and forgetting to Cancel before navigating away. The app clears the stale editing date on navigation, but the banner can be confusing.","Expecting the inline activity Edit and the Export buttons to work. Both are coming soon."],"troubleshooting":[{"problem":"Why am I stuck editing a past day?","causes":["You opened a past day from History and the editing banner is still showing"],"fix":"Tap Cancel on the red banner. Navigating to another screen also clears the editing state."},{"problem":"Why won't the context popup accept a contact?","causes":["The contact-search only matches contacts that already exist"],"fix":"Add the person as a contact first, then choose them in the popup."}],"faqs":[{"q":"Is this the same as the Scorecard log?","a":"It uses the same scoring, but this view adds a richer summary and context prompts."},{"q":"How do I log for a past day?","a":"Open the day from History and tap Edit. The red editing banner confirms which day you are editing."},{"q":"What is a context popup?","a":"Some activities ask who, where, or how for better records, such as the event, contact, method, or deal value."},{"q":"Can I add a custom one-off activity?","a":"Yes. Tap Add Activity Manually."},{"q":"Why can't I edit an already-logged activity inline?","a":"Inline activity editing is coming soon."}],"related":["scoring-points-tiers-lead-lag","scorecard-home-daily-log","crm-history-reporting","crm-todays-tasks"]},{"id":"crm-pipeline-opportunities","product":"swh","category":"Pipeline","title":"Track opportunities, referrals, and event ROI in the Pipeline","summary":"Move deals through stages, log referrals given and received, and measure your return on investment per networking event.","audience":"Loan officer / Realtor","keywords":["pipeline","opportunities","referrals","event ROI","Add Opportunity","stages","Referral Received","Contacted","Proposal","Won","Lost","Log Referral","Add Event","Rename Event","Merge Event","estimated value","investment"],"overview":{"what":"The deal-tracking surface. Track opportunities through stages, log referrals you gave and received, and measure return on investment per networking event.","why":"It connects your networking effort to revenue, so you can see which events and relationships actually pay off.","who":"Sales users tracking deals and referral activity."},"steps":[{"title":"Open the Pipeline and choose a tab","body":"Open the Pipeline and use the tab bar to switch between Opportunities, Referrals, and Event ROI.","screenshot":"/help-screenshots/swh/crm-pipeline-opportunities/step-1.png","caption":"The Pipeline tab bar: Opportunities, Referrals, Event ROI."},{"title":"Add and advance an opportunity","body":"On the Opportunities tab, tap plus Add Opportunity (or use Add Opp from a contact). Enter the Opportunity Name (required), Estimated Value, Stage, Contact Name, Referred By, Event or Source, and Notes. Save, then open the opp to move stages or mark it Won or Lost.","screenshot":"/help-screenshots/swh/crm-pipeline-opportunities/step-2.png","caption":"The Add Opportunity form with name, value, and stage."},{"title":"Log a referral","body":"On the Referrals tab, use the Given and Received sub-tabs and tap plus Log Referral. Record the direction, the people involved, and the outcome, then track its status over time.","screenshot":"/help-screenshots/swh/crm-pipeline-opportunities/step-3.png","caption":"The Referrals tab with Given and Received sub-tabs."},{"title":"Measure event ROI","body":"On the Event ROI tab, tap plus Add Event and enter the name, date, and investment. The table computes Contacts, Opps, Won, Revenue, Cost, and ROI per event.","screenshot":"/help-screenshots/swh/crm-pipeline-opportunities/step-4.png","caption":"The Event ROI table with computed columns."},{"title":"Clean up duplicate events","body":"Use Rename or Merge Event to consolidate duplicate event names across contacts and opportunities so your ROI is not split.","screenshot":"/help-screenshots/swh/crm-pipeline-opportunities/step-5.png","caption":"The Rename/Merge Event dialog with a New Name field."}],"expectedResult":"Your opportunity appears in its stage column, referrals are tracked by direction, and the Event ROI table shows revenue from won opportunities against each event's investment cost. Won and Lost opportunities are excluded from open-pipeline value.","expectedScreenshot":"/help-screenshots/swh/crm-pipeline-opportunities/result.png","commonMistakes":["Logging a deal value on the contact but not creating an opportunity. Revenue will not roll into Event ROI.","Using inconsistent event names, which splits ROI across duplicates. Use Rename or Merge to consolidate."],"troubleshooting":[{"problem":"Why does my Event ROI look wrong?","causes":["Revenue only counts opportunities marked Won that are tied to that event or source"],"fix":"Make sure each won opportunity has the correct Event or Source set so its revenue rolls into that event."},{"problem":"Why won't my opportunity save?","causes":["The Opportunity Name field is empty"],"fix":"Enter an Opportunity Name, which is required, then save again."},{"problem":"Why do I have two versions of the same event?","causes":["The event name was entered slightly differently in different places"],"fix":"Use Rename or Merge Event and pick the canonical name from the datalist to merge them."}],"faqs":[{"q":"What are the pipeline stages?","a":"Referral Received, Contacted, Proposal, then Won or Lost."},{"q":"How do I track a deal?","a":"Add an Opportunity and advance its stage as it progresses."},{"q":"How is Event ROI calculated?","a":"Revenue from won opportunities tied to the event versus the event's investment cost."},{"q":"How do I track referrals I gave versus received?","a":"Use the Given and Received sub-tabs on the Referrals tab."},{"q":"How do I fix two versions of the same event name?","a":"Use Rename or Merge Event to consolidate them."},{"q":"Can I attach an opportunity to a contact?","a":"Yes. Use Add Opp from the contact, or set the Contact Name on the opportunity."}],"related":["crm-network-contacts","crm-dashboard","crm-contact-profile-form-8-steps"]},{"id":"crm-history-reporting","product":"swh","category":"Reporting","title":"Review your weekly recap and past days in CRM History","summary":"Use History to read your Last Week recap with coaching, scan trends and activity mix, and edit any past day you logged.","audience":"Loan officer / Realtor / Networker","keywords":["History","weekly recap","Last Week","lead vs lag","activity mix","daily points trend","coaching","edit past day","Add More","This Week","This Month","6 Months","Lifetime"],"overview":{"what":"Your longitudinal reporting view. It shows weekly through lifetime totals, lead-vs-lag indicators, a Last Week recap with coaching, your activity mix, a daily points trend chart, and a list of past days you can edit.","why":"It is the place to do your weekly review, learn from the coaching, and correct any day you logged wrong.","who":"Sales users and networkers reviewing their performance over time."},"steps":[{"title":"Open History","body":"Open the History screen and use the range toggle to choose This Week, This Month, 6 Months, or Lifetime.","screenshot":"/help-screenshots/swh/crm-history-reporting/step-1.png","caption":"The History range toggle."},{"title":"Read the Last Week recap","body":"Read the Last Week card: total points, average per day, your lead-vs-lag split, your tier badge, the activity mix, and SWH coaching.","screenshot":"/help-screenshots/swh/crm-history-reporting/step-2.png","caption":"The Last Week recap card with coaching."},{"title":"Scan trends and mix","body":"Review the daily trend chart and the category mix to see how your effort is distributed.","screenshot":"/help-screenshots/swh/crm-history-reporting/step-3.png","caption":"The daily points trend chart and category mix."},{"title":"Edit or add to a past day","body":"Tap any past day to Edit it, which jumps to the Log screen with the editing banner. For today, tap plus Add More to log additional activity.","screenshot":"/help-screenshots/swh/crm-history-reporting/step-4.png","caption":"Tapping a past day to edit it."}],"expectedResult":"You see your KPI tiles, chart bars, and a day list for the selected range. Editing a past day recomputes its points and updates that week's total.","expectedScreenshot":"/help-screenshots/swh/crm-history-reporting/result.png","commonMistakes":["Editing a past day without realizing the points recompute, which changes that week's total.","Expecting the Export button to work. Export is coming soon."],"troubleshooting":[{"problem":"Why is my Last Week card blank?","causes":["No activity was logged last week"],"fix":"Log activity going forward. The recap fills in once there is a saved week to summarize."},{"problem":"Why is my chart flat?","causes":["There is not enough history yet"],"fix":"Keep logging your days. The chart fills in as your history grows."}],"faqs":[{"q":"How far back can I see?","a":"Up to Lifetime using the range toggle."},{"q":"Can I fix a day I logged wrong?","a":"Yes. Tap the day and choose Edit to correct it on the Log screen."},{"q":"What is in the weekly recap?","a":"Total points, your lead and lag split, your tier badge, the activity mix, and coaching."},{"q":"Is this the same data as the Scorecard Scoreboard?","a":"Yes, it is the same engine. History is the richer version of the same data."},{"q":"How do I export my history?","a":"Not yet. Export is coming soon."}],"related":["scorecard-scoreboard-stats","crm-log-activities","scoring-points-tiers-lead-lag"]},{"id":"crm-appointments","product":"swh","category":"Scheduling","title":"See your booking pages and meetings in the Appointments screen","summary":"View your MyAppointment.AI booking pages and upcoming meetings inside the CRM, and share a booking link for a specific contact.","audience":"Loan officer / Realtor","keywords":["appointments","MyAppointment.AI","booking pages","booking link","mylola.ai","Manage","Set up","Refresh","getApptData","Book Contact","upcoming meetings","scheduling"],"overview":{"what":"A view that surfaces your MyAppointment.AI booking pages and upcoming meetings inside the CRM, and lets you share a booking link for a specific contact.","why":"It keeps your scheduling visible alongside your contacts so you can book the right people without leaving the CRM.","who":"Sales users who use MyAppointment.AI for booking."},"steps":[{"title":"Open Appointments","body":"Open the Appointments screen to review your booking pages and upcoming meetings.","screenshot":"/help-screenshots/swh/crm-appointments/step-1.png","caption":"The Appointments screen with booking pages and meetings."},{"title":"Manage your booking pages externally","body":"To create or edit booking pages, tap Manage or Set up on mylola.ai. Booking configuration lives on mylola.ai, not inside SWH.","screenshot":"/help-screenshots/swh/crm-appointments/step-2.png","caption":"The Manage and Set up on mylola.ai buttons."},{"title":"Refresh to pull the latest","body":"Tap Refresh to re-pull your appointment data if the list looks stale.","screenshot":"/help-screenshots/swh/crm-appointments/step-3.png","caption":"The Refresh button on the Appointments screen."},{"title":"Book a specific contact","body":"Open a contact and tap Book (shown when a booking link is available). Choose a page in the Book Contact modal, then copy or open the link to share it.","screenshot":"/help-screenshots/swh/crm-appointments/step-4.png","caption":"The Book Contact modal for picking and sharing a link."}],"expectedResult":"You see your booking pages and upcoming meetings, and you can copy a contact's booking link to share. Bookings that get confirmed write the contact and activity back into SWH automatically.","expectedScreenshot":"/help-screenshots/swh/crm-appointments/result.png","commonMistakes":["Trying to create booking pages inside SWH. That must be done on mylola.ai.","Expecting a guest name on every meeting card. Meeting docs link the guest by reference, not by name."],"troubleshooting":[{"problem":"Why is there no booking link for a contact?","causes":["You have not set up a page on mylola.ai yet"],"fix":"Tap the blue Set up button to create a booking page on mylola.ai, then return and refresh."},{"problem":"Why aren't my meetings showing?","causes":["The appointment data fetch failed","Your SWH email does not resolve to a MyAppointment user"],"fix":"Tap Refresh. If meetings still do not appear, confirm you use the same email on MyAppointment.AI."}],"faqs":[{"q":"Where do I create my booking page?","a":"On mylola.ai. Tap Manage to go there. Booking configuration lives outside SWH."},{"q":"Why do bookings appear here automatically?","a":"When a booking is confirmed, a Cloud Function writes the contact and activity into SWH for you."},{"q":"How do I send a contact my booking link?","a":"Open the contact, tap Book, pick a page, and copy the link."},{"q":"Why doesn't a meeting show the guest's name?","a":"The meeting doc links the guest by reference rather than storing the name directly."},{"q":"Do I need a paid plan?","a":"Yes. Booking and scheduling are gated by plan tier."}],"related":["crm-network-contacts","crm-settings","crm-dashboard"]},{"id":"crm-settings","product":"swh","category":"Settings","title":"Configure goals, integrations, and playbooks in CRM Settings","summary":"Set your weekly goal and calendar behavior, import contacts, connect Gmail or Outlook, manage playbooks, and handle your account from Settings.","audience":"Loan officer / Realtor / Admin","keywords":["settings","weekly goal","week starts on","weekly summary email","import contacts","CSV","Excel","Edit Activities & Points","Gmail","Outlook","auto-log emails","MyLola","follow-through playbooks","wasted thresholds","team","subscription","billing","sign out","calendar event time","Lola Connect"],"overview":{"what":"The configuration hub for the CRM. It covers goal and tiers, calendar behavior, week start, the weekly email, data import and export, activity customization, email integrations, scheduling, MyLola CRM sync, follow-through playbooks, wasted thresholds, team, and account and billing.","why":"It is where you tailor SWH to how you work, from your weekly goal to which inboxes auto-log emails.","who":"Sales users and networkers, with some rows limited to team owners and admins."},"steps":[{"title":"Set your goal and calendar behavior","body":"In Goal & Tiers, set your Weekly Point Goal, Networker Tiers, Calendar Event Time, the Auto-add 8-Step to Google Calendar toggle, Week Starts On, and the Weekly Summary Email.","screenshot":"/help-screenshots/swh/crm-settings/step-1.png","caption":"The Goal & Tiers section in Settings."},{"title":"Import your contacts","body":"In Data & Import, choose Import Contacts and upload a CSV or Excel file. Duplicates are detected by phone number, then you map and confirm the import.","screenshot":"/help-screenshots/swh/crm-settings/step-2.png","caption":"The Import Contacts file picker."},{"title":"Connect Gmail or Outlook to auto-log emails","body":"In Email Integrations, choose Gmail or Outlook and authorize via OAuth. A scheduled sync keeps each contact's Emails tab current. New in beta: the Email & Calendar (Lola Connect) card at the top of Email, Calendar & Contacts connects one account for the whole Lola platform. When it is enabled for your account, prefer it over the per-app connections.","screenshot":"/help-screenshots/swh/crm-settings/step-3.png","caption":"The Email Integrations connect buttons."},{"title":"Customize activities and playbooks","body":"Use Edit Activities & Points to change your activity catalog (and Reset to Defaults if needed), and use Follow-Through Playbooks to manage or create new follow-up sequences.","screenshot":"/help-screenshots/swh/crm-settings/step-4.png","caption":"Activity editor and Follow-Through Playbooks options."},{"title":"Manage your account","body":"In Account, update your name and email, manage Subscription and billing, and Sign Out when you are done.","screenshot":"/help-screenshots/swh/crm-settings/step-5.png","caption":"The Account section with subscription and sign out."}],"expectedResult":"Your settings save and take effect: your goal updates, your imported contacts appear in My Network, connected inboxes show a connected status, and weekly emails fire on the scheduled day and hour.","expectedScreenshot":"/help-screenshots/swh/crm-settings/result.png","commonMistakes":["Enabling the Weekly Summary Email and expecting it immediately. It fires on the scheduled day and hour.","Expecting Export and Notifications to work. Both are coming soon.","Editing activities and assuming past history changes. It does not. Edits apply to new logs only."],"troubleshooting":[{"problem":"Why did my weekly email never arrive?","causes":["The weekly email is turned off","The timezone is wrong","It was already sent within the dedupe window"],"fix":"Confirm Weekly Summary Email is enabled with the correct day, time, and timezone. If one already went out this period, the next one fires on the schedule."},{"problem":"Why won't Gmail connect?","causes":["An OAuth scope or consent issue during authorization"],"fix":"Reconnect Gmail and grant the requested permissions during the OAuth flow."},{"problem":"Why does my booking link show Set up?","causes":["You do not have a MyAppointment page yet"],"fix":"Tap Set up to create a booking page on mylola.ai, then return to Settings."}],"faqs":[{"q":"How do I change my weekly goal?","a":"Go to Goal & Tiers and set Weekly Point Goal."},{"q":"How do I get a weekly recap email?","a":"Enable Weekly Summary Email and set the day and time."},{"q":"Can I import my existing contacts?","a":"Yes. Upload a CSV or Excel file. Duplicates are caught by phone number."},{"q":"How do emails auto-log?","a":"Connect Gmail or Outlook in Email Integrations."},{"q":"What is MyLola sync?","a":"It pushes your SWH contacts into the MyLola mortgage CRM."},{"q":"How do I auto-schedule the 8 steps on my calendar?","a":"Turn on the Auto-add 8-Step toggle and set the Calendar Event Time."},{"q":"How do I export my contacts?","a":"Not yet. Export is coming soon."}],"related":["crm-contact-profile-form-8-steps","crm-network-contacts","swh-teams","crm-appointments","scoring-points-tiers-lead-lag"]},{"id":"swh-lola-connect-email-calendar","product":"swh","category":"Settings","title":"Connect email and calendar with Lola Connect (beta)","summary":"One secure connection powers email and calendar across SWH and the rest of the Lola platform. Connect Google or Outlook once and every Lola product you use can work from the same account.","audience":"Loan officer / Realtor / Networker","keywords":["Lola Connect","email","calendar","Google","Outlook","IMAP","connect account","beta","integrations","disconnect","availability","MyAppointment","email and calendar","connected account"],"overview":{"what":"Lola Connect is the platform’s shared connection layer for email and calendar. You authorize your account once through a secure hosted sign-in, and that single connection serves SWH and other Lola products (like MyAppointment scheduling) without connecting each app separately.","why":"One connection means fewer sign-ins, no duplicate accounts, and a single place to see what is connected. Over time it replaces the older per-app integrations.","who":"Beta users first. If you do not see the card yet, your account has not been enabled; the rollout is gradual."},"steps":[{"title":"Find the card in Settings","body":"In the CRM, open Settings and look at the top of Email, Calendar & Contacts for Email & Calendar (Lola Connect · beta). In the Scorecard app, the same connection appears in Settings under Calendar as Calendar (Lola Connect · beta)."},{"title":"Connect your account","body":"Choose Google, Outlook, or IMAP (IMAP is email only, so the Scorecard card offers Google and Outlook). A secure hosted sign-in opens on the provider’s own page. Approve access and you return to Settings with the card showing Connected and your address."},{"title":"Reuse one account across Lola products","body":"If you already connected this account in another Lola product, you will not sign in again. The platform reuses the existing connection and simply enables it here, which avoids duplicate accounts on the same mailbox."},{"title":"Disconnect only when you mean it","body":"Disconnect on the card removes the connection. Because one connection can serve several Lola products, disconnecting here can also turn it off in those products. Reconnecting later restores the same connection rather than creating a duplicate."}],"expectedResult":"The card shows Connected with your email address. On the email side, the CRM beta can read mail for your contact work. On the calendar side, the connection powers availability protection, like keeping your booked time off your public MyAppointment page. More features move onto the connection as the beta rolls forward.","commonMistakes":["Connecting the same mailbox a second time instead of using the reuse prompt. Always prefer the use-this-account option when it is offered.","Expecting the card on every account. It is a beta and appears only once your account is enabled.","Disconnecting to fix a glitch. Try reconnecting first, and remember the connection is shared across Lola products before removing it."],"troubleshooting":[{"problem":"I do not see the Lola Connect card in Settings","causes":["Your account is not in the beta yet","You are on an old cached version of the app"],"fix":"Refresh the page or update the app. If it still does not appear, the beta has not reached your account yet. Email support if you believe it should have."},{"problem":"The card shows an error or says the connection expired","causes":["Your Google or Microsoft session was revoked or the password changed","The provider asked for fresh consent"],"fix":"Tap the connect button again and approve the hosted sign-in. Reconnecting restores the same connection instead of creating a duplicate."},{"problem":"I connected but a feature still is not using it","causes":["Some features are still on the older per-app integrations during the beta"],"fix":"That is expected during rollout. Features move onto Lola Connect one at a time, and the card showing Connected means you are ready as each one lands."}],"faqs":[{"q":"Does SWH store my email password?","a":"No. You sign in on Google’s or Microsoft’s own page through a certified hosted flow. SWH never sees your password and stores only a reference to the connection."},{"q":"How is this different from the older Gmail and Outlook integrations?","a":"The older integrations connect one app at a time. Lola Connect is one connection shared across the whole platform, and it is where all email and calendar features are heading. The older paths keep working during the transition."},{"q":"What does it power today?","a":"Email reading in the CRM beta and calendar availability protection for MyAppointment booking pages, with email sending and calendar invites rolling in next."},{"q":"Can I connect more than one account?","a":"The beta focuses on one primary account per person. If you need a second mailbox connected, email support and we will note the request."}]},{"id":"swh-teams","product":"swh","category":"Teams","title":"Start and run a team plan in SWH","summary":"Owners and co-leads can start a team plan, invite members, and view team standings, a weekly report, and Microsoft SSO.","audience":"Admin / Team","keywords":["teams","team plan","invite member","team dashboard","activity feed","weekly report","M365 SSO","Microsoft SSO","co-lead","owner","per seat","60-day trial","team standings"],"overview":{"what":"Team subscriptions. An owner or co-lead invites members, sees a team dashboard and activity feed, and configures a team weekly report and Microsoft M365 SSO.","why":"It lets a sales team track networking together, compare standings, and roll up activity into one report.","who":"Team owners and co-leads for the admin features, and team members for standings."},"steps":[{"title":"Start a team plan","body":"Go to Settings, Team, then Start a Team Plan and complete checkout. You pay per seat, with a 60-day trial. The current per-seat price, plus any volume discount for larger teams, is shown at checkout.","screenshot":"/help-screenshots/swh/swh-teams/step-1.png","caption":"The Start a Team Plan checkout."},{"title":"Invite members","body":"Invite members by email. They accept the invite to join your team.","screenshot":"/help-screenshots/swh/swh-teams/step-2.png","caption":"Inviting members to the team."},{"title":"Run the team dashboard and report","body":"Open the team dashboard and activity feed to see standings, configure the weekly team report, and set up M365 SSO if you use Microsoft.","screenshot":"/help-screenshots/swh/swh-teams/step-3.png","caption":"The team dashboard with standings and report settings."}],"expectedResult":"Your team is set up, members appear after they accept their invites, and owners and co-leads can see the dashboard, activity feed, weekly report, and SSO options.","expectedScreenshot":"/help-screenshots/swh/swh-teams/result.png","commonMistakes":["Assuming the team report and SSO rows are visible to everyone. They are owner and co-lead only.","Expecting an invited member to appear before they have accepted the invite."],"troubleshooting":[{"problem":"Why is the team navigation hidden for me?","causes":["You are not an owner, co-lead, or admin"],"fix":"Team management is limited to owners and co-leads. Ask your team owner to grant the role or manage the team for you."},{"problem":"Why didn't an invited member get their invite?","causes":["The invite email did not reach them or is in the mail queue"],"fix":"Ask them to check spam, confirm the email address, and resend the invite if needed."}],"faqs":[{"q":"How much is a team plan?","a":"You pay per seat, with a 60-day trial and volume discounts for larger teams. The exact per-seat price is shown when you start or manage the plan."},{"q":"Who can manage the team?","a":"The owner and any co-leads."},{"q":"Can we use Microsoft SSO?","a":"Yes. M365 SSO is available to owners and co-leads."},{"q":"How do members join?","a":"Through an invite they accept."},{"q":"Do members see each other's activity?","a":"Yes, through the team dashboard and activity feed."}],"related":["crm-settings","swh-sign-in-auth"]},{"id":"swh-sign-in-auth","product":"swh","category":"Account","title":"Sign in to SWH and resolve plan and login issues","summary":"Sign in with Google (or Microsoft for team SSO), understand the plan gate, and fix login hangs on older iOS builds.","audience":"Loan officer / Realtor / Networker / Admin","keywords":["sign in","login","Google sign-in","Microsoft","team SSO","plan gate","upgrade screen","iOS hang","capacitor","getMe","saveDay","sign out","no valid plan"],"overview":{"what":"Authentication for both SWH surfaces. You sign in with Google, or with Microsoft for team SSO, and access is gated by your plan.","why":"It keeps your data secure and makes sure you only reach the features your plan includes.","who":"All SWH users."},"steps":[{"title":"Sign in with Google","body":"On the login screen, tap Sign in with Google and complete the Google prompt. Team members on Microsoft can use the Microsoft sign-in for team SSO.","screenshot":"/help-screenshots/swh/swh-sign-in-auth/step-1.png","caption":"The Sign in with Google button on the login screen."},{"title":"Pass the plan gate","body":"After sign-in, the app checks your plan. On native iOS, the scorecard plan is accepted. If you have no active plan, you land on the Upgrade screen.","screenshot":"/help-screenshots/swh/swh-sign-in-auth/step-2.png","caption":"The plan gate routing to the app or the Upgrade screen."},{"title":"Sign out when needed","body":"To sign out, go to Settings and tap Sign Out.","screenshot":"/help-screenshots/swh/swh-sign-in-auth/step-3.png","caption":"The Sign Out option in Settings."}],"expectedResult":"You are signed in and land on your app (Home or Dashboard). With no active plan, you see the Upgrade screen instead.","expectedScreenshot":"/help-screenshots/swh/swh-sign-in-auth/result.png","commonMistakes":["Running an old iOS build. On native, the Firebase web SDK hangs on the capacitor origin, so older builds can freeze after login.","Expecting to reach the app without an active plan. With no valid scorecard or pro plan, you stay on the Upgrade screen."],"troubleshooting":[{"problem":"Why does the app hang after login on my iPhone?","causes":["You are on an old build that uses the web SDK on native, which hangs on the capacitor origin"],"fix":"Update to the latest build. Current builds route through the getMe and saveDay Cloud Functions instead of the web SDK and do not hang."},{"pro
