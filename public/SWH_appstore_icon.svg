<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .monogram {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 390px;
        font-weight: 700;
        fill: #FFFFFF;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
    <clipPath id="iconClip">
      <rect x="0" y="0" width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- Full bleed background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="#1A1A2E"/>

  <!-- Subtle gold inner border -->
  <rect x="20" y="20" width="984" height="984" rx="206" fill="none" stroke="#D4A843" stroke-width="4" opacity="0.45"/>

  <!-- SWH Monogram -->
  <text x="512" y="524" class="monogram">SWH</text>
</svg>
