<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.55">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8E6"/>
      <stop offset="100%" stop-color="#F0D578"/>
    </linearGradient>
    <linearGradient id="redCircle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#b8252f"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A8A6A"/>
      <stop offset="100%" stop-color="#3F6A4D"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  <rect width="600" height="600" fill="url(#glow)"/>

  <!-- SWH brand corner stamp (top-left) -->
  <g transform="translate(36, 36)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="url(#redCircle)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="18" font-weight="900" fill="#ffffff" letter-spacing="0.5">SWH</text>
  </g>
  <text x="100" y="58" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="rgba(255,255,255,0.55)" letter-spacing="2.4">STOP WASTING HANDSHAKES</text>

  <!-- Phone mockup — center, slight tilt -->
  <g transform="translate(300, 320) rotate(-4)">
    <!-- Phone body / bezel -->
    <rect x="-118" y="-228" width="236" height="456" rx="36" fill="url(#phoneBody)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <!-- Phone screen -->
    <rect x="-108" y="-215" width="216" height="430" rx="26" fill="#ffffff"/>
    <!-- Dynamic island -->
    <rect x="-32" y="-206" width="64" height="22" rx="11" fill="#0a0a0a"/>

    <!-- Status bar -->
    <text x="85" y="-193" text-anchor="end" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#0a0a0a">100%</text>

    <!-- App header -->
    <text x="0" y="-150" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="11" font-weight="900" fill="#E63946" letter-spacing="2.6">SCORECARD</text>
    <text x="0" y="-130" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#6B7280">Thu, May 18</text>

    <!-- Big score number -->
    <text x="0" y="-60" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="72" font-weight="900" fill="#0a0a0a" letter-spacing="-3">175</text>
    <text x="0" y="-38" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#9CA3AF" letter-spacing="1.8">POINTS THIS WEEK</text>

    <!-- Tier badge — no emoji, custom medal SVG -->
    <g transform="translate(0, -10)">
      <rect x="-72" y="-15" width="144" height="30" rx="15" fill="url(#goldGrad)" stroke="#D4A847" stroke-width="1"/>
      <!-- Small medal icon: gold circle with #2 -->
      <circle cx="-52" cy="0" r="9" fill="#D4A847"/>
      <text x="-52" y="3" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="900" fill="#fff">2</text>
      <text x="10" y="4" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="10" font-weight="900" fill="#7A5C0F" letter-spacing="1.4">PROFESSIONAL</text>
    </g>

    <!-- Progress bar -->
    <g transform="translate(0, 28)">
      <rect x="-88" y="0" width="176" height="8" rx="4" fill="#E4E4E7"/>
      <rect x="-88" y="0" width="138" height="8" rx="4" fill="#5A8A6A"/>
      <text x="-88" y="24" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#5A8A6A" letter-spacing="0.8">GOAL HIT · 117%</text>
      <text x="88" y="24" text-anchor="end" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#9CA3AF" letter-spacing="0.4">175 / 150</text>
    </g>

    <!-- Activity row 1 — Conversations (red square icon) -->
    <g transform="translate(0, 70)">
      <rect x="-90" y="0" width="180" height="36" rx="9" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="0.6"/>
      <rect x="-80" y="9" width="18" height="18" rx="5" fill="#E63946"/>
      <text x="-71" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff">C</text>
      <text x="-50" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#0a0a0a">Conversations</text>
      <text x="-50" y="27" font-family="-apple-system, sans-serif" font-size="7" fill="#9CA3AF">5 pts each</text>
      <text x="78" y="24" text-anchor="end" font-family="Georgia, serif" font-size="16" font-weight="900" fill="#0a0a0a">7</text>
    </g>

    <!-- Activity row 2 — 1:1 Meetings (navy square icon) -->
    <g transform="translate(0, 114)">
      <rect x="-90" y="0" width="180" height="36" rx="9" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="0.6"/>
      <rect x="-80" y="9" width="18" height="18" rx="5" fill="#1F4F87"/>
      <text x="-71" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff">M</text>
      <text x="-50" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#0a0a0a">1:1 Meetings</text>
      <text x="-50" y="27" font-family="-apple-system, sans-serif" font-size="7" fill="#9CA3AF">10 pts each</text>
      <text x="78" y="24" text-anchor="end" font-family="Georgia, serif" font-size="16" font-weight="900" fill="#0a0a0a">4</text>
    </g>

    <!-- Activity row 3 — Intros Made (highlighted "just logged") -->
    <g transform="translate(0, 158)">
      <rect x="-90" y="0" width="180" height="36" rx="9" fill="#FFF1F1" stroke="#FBC9CE" stroke-width="0.8"/>
      <rect x="-80" y="9" width="18" height="18" rx="5" fill="#5A8A6A"/>
      <text x="-71" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#ffffff">I</text>
      <text x="-50" y="16" font-family="-apple-system, sans-serif" font-size="9" font-weight="800" fill="#0a0a0a">Intros Made</text>
      <text x="-50" y="27" font-family="-apple-system, sans-serif" font-size="7" fill="#9CA3AF">10 pts each</text>
      <text x="78" y="24" text-anchor="end" font-family="Georgia, serif" font-size="16" font-weight="900" fill="#E63946">+1</text>
    </g>
  </g>

  <!-- Floating "+1" coin — top-right -->
  <g transform="translate(485, 195) rotate(14)">
    <circle cx="0" cy="0" r="42" fill="url(#redCircle)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="900" fill="#ffffff">+1</text>
  </g>

  <!-- Floating check coin — bottom-left -->
  <g transform="translate(95, 470) rotate(-10)">
    <circle cx="0" cy="0" r="36" fill="url(#greenGrad)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.35"/>
    <!-- Custom checkmark as path (no emoji) -->
    <path d="M -12 0 L -3 9 L 14 -10" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bottom tagline strip -->
  <text x="300" y="568" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="rgba(255,255,255,0.50)" letter-spacing="2.8">TRACK · TIER UP · CLOSE MORE</text>
</svg>
